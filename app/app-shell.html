<title>FFP Cost Control</title>
<style>
:root{
  --bg:#f4f6f8; --panel:#ffffff; --border:#dde3e8; --text:#1a2733; --muted:#6b7a87;
  --accent:#0f6e4f; --accent-dark:#0a4f38; --accent-bg:#e6f4ee;
  --danger:#c0392b; --danger-bg:#fdeceb; --warn:#b7791f; --warn-bg:#fdf3e0;
  --ok:#1e8e5a; --shadow:0 1px 3px rgba(20,30,40,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12181d; --panel:#1a2229; --border:#2a343c; --text:#e6edf3; --muted:#93a1ac;
    --accent:#2fae7f; --accent-dark:#2fae7f; --accent-bg:#123a2c;
    --danger:#e5766a; --danger-bg:#3a1f1c; --warn:#e0b463; --warn-bg:#3a2f14; --ok:#4fce9a;
  }
}
:root[data-theme="dark"]{
  --bg:#12181d; --panel:#1a2229; --border:#2a343c; --text:#e6edf3; --muted:#93a1ac;
  --accent:#2fae7f; --accent-dark:#2fae7f; --accent-bg:#123a2c;
  --danger:#e5766a; --danger-bg:#3a1f1c; --warn:#e0b463; --warn-bg:#3a2f14; --ok:#4fce9a;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;}
a{color:var(--accent);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 9px;width:100%;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;}
label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin:8px 0 3px;}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap;}
.btn:hover{border-color:var(--accent);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}

@media(max-width:820px){
  #sidebar{position:fixed;left:-240px;top:0;height:100vh;z-index:50;transition:left .2s;box-shadow:0 0 20px rgba(0,0,0,.2);}

<script>
/* =============================================================================
   FFP Cost Control — warstwa danych.
   Jedyne źródło prawdy: PostgreSQL, przez API Next.js (app/api/**).
   STATE poniżej to WYŁĄCZNIE lokalna kopia w pamięci przeglądarki, hydratowana
   z /api/bootstrap przy starcie i po każdym zapisie — nigdy nie jest zapisywana
   bezpośrednio do żadnego trwałego magazynu przeglądarki (localStorage служy
   tu tylko do zapamiętania OSTATNIO OTWARTEJ ZAKŁADKI, co jest czystą wygodą
   nawigacyjną i nie ma nic wspólnego z przechowywaniem danych firmowych).
   ========================================================================== */
var STATE = { departments:[], projects:[], employees:[], vendors:[], costs:[], contracts:[], financings:[], documents:[], costCategories:[], costCenters:[], currency:'PLN' };
var BOOTED = false;

var currentTab = (function(){ try{ return localStorage.getItem('ffp_tab')||'dashboard'; }catch(e){ return 'dashboard'; } })();
var searchQuery = '';
var pendingModalSave = null;

/* ============================= HELPERS ============================= */
function uid(prefix){ return (prefix||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fmtMoney(n){
  n = Number(n)||0;
  var s = n.toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2});
  return s+' zł';
}
function fmtMoney0(n){
  n = Number(n)||0;
  return n.toLocaleString('pl-PL',{maximumFractionDigits:0})+' zł';
}
function fmtDate(iso){
  if(!iso) return '—';
  var p = iso.split('-'); if(p.length!==3) return iso;
  return p[2]+'.'+p[1]+'.'+p[0];
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysUntil(iso){ if(!iso) return null; var d=new Date(iso+'T00:00:00'); var t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function byId(arr,id){ return arr.find(function(x){return x.id===id;}); }
function deptName(id){ var d=byId(STATE.departments,id); return d?d.name:'—'; }
function projectName(id){ if(id==='ADMIN') return 'Administracja / Centrala'; var p=byId(STATE.projects,id); return p?p.name:'—'; }
function vendorName(id){ var v=byId(STATE.vendors,id); return v?v.name:'—'; }
function empName(e){ return e.firstName+' '+e.lastName; }

function monthlyEquivalent(cost){
  var g = Number(cost.grossAmount)||Number(cost.netAmount)||0;
  switch(cost.recurrence){
    case 'miesięczny': return g;
    case 'kwartalny': return g/3;
    case 'półroczny': return g/6;
    case 'roczny': return g/12;
    default: return 0; // jednorazowy / nieregularny - not part of recurring run-rate
  }
}
function annualEquivalent(cost){ return monthlyEquivalent(cost)*12; }

function totalMonthlyCostEmployee(e){
  if(e.status==='zakończona współpraca') return 0;
  var base = Number(e.employerCost)||Number(e.grossSalary)||0;
  var extra = (Number(e.otherMonthlyCost)||0)+(Number(e.bonus)||0)+(Number(e.car)||0)+(Number(e.phoneCost)||0)+(Number(e.computer)||0)+(Number(e.otherBenefits)||0);
  return base+extra;
}

function empAllocPct(e,projectId){
  if(!e.allocations||!e.allocations.length) return projectId==='ADMIN'?100:0;
  var a = e.allocations.find(function(x){return x.projectId===projectId;});
  return a?Number(a.pct)||0:0;
}

function metrics(){
  var activeEmployees = STATE.employees.filter(function(e){return e.status!=='zakończona współpraca';});
  var monthlyPayroll = activeEmployees.reduce(function(s,e){return s+totalMonthlyCostEmployee(e);},0);
  var monthlyExternal = STATE.costs.reduce(function(s,c){return s+monthlyEquivalent(c);},0);
  var monthlyFinancing = STATE.financings.reduce(function(s,f){return s+(Number(f.monthlyPayment)||0);},0);
  var monthlyFixedNonPayroll = STATE.costs.filter(function(c){return c.isFixed;}).reduce(function(s,c){return s+monthlyEquivalent(c);},0);
  var monthlyFixed = monthlyPayroll+monthlyFixedNonPayroll+monthlyFinancing;
  var totalBurn = monthlyPayroll+monthlyExternal+monthlyFinancing;
  var annualRunRate = totalBurn*12;

  var monthlyProjectCost = STATE.projects.reduce(function(sum,p){
    var c = STATE.costs.filter(function(x){return x.projectId===p.id;}).reduce(function(s,x){return s+monthlyEquivalent(x);},0);
    var emp = activeEmployees.reduce(function(s,e){return s+totalMonthlyCostEmployee(e)*(empAllocPct(e,p.id)/100);},0);
    sum[p.id] = c+emp; return sum;
  },{});
  var totalProjectCost = Object.keys(monthlyProjectCost).reduce(function(s,k){return s+monthlyProjectCost[k];},0);

  var monthlyProjectRevenue = STATE.projects.reduce(function(sum,p){ sum[p.id] = Number(p.revenueMonthly)||0; return sum; },{});
  var monthlyRevenue = Object.keys(monthlyProjectRevenue).reduce(function(s,k){return s+monthlyProjectRevenue[k];},0);

  var unassignedCosts = STATE.costs.filter(function(c){return !c.projectId;});
  var monthlyAdminFromCosts = unassignedCosts.reduce(function(s,c){return s+monthlyEquivalent(c);},0);
  var monthlyAdminFromEmp = activeEmployees.reduce(function(s,e){return s+totalMonthlyCostEmployee(e)*(empAllocPct(e,'ADMIN')/100);},0);
  var monthlyAdmin = monthlyAdminFromCosts+monthlyAdminFromEmp;

  var deptCost = {};
  STATE.departments.forEach(function(d){
    var empC = activeEmployees.filter(function(e){return e.departmentId===d.id;}).reduce(function(s,e){return s+totalMonthlyCostEmployee(e);},0);
    var costC = STATE.costs.filter(function(c){return c.departmentId===d.id;}).reduce(function(s,c){return s+monthlyEquivalent(c);},0);
    deptCost[d.id] = {employees:activeEmployees.filter(function(e){return e.departmentId===d.id;}).length, empCost:empC, otherCost:costC, total:empC+costC};
  });

  function upcomingIn(days){
    return STATE.costs.filter(function(c){
      if(c.paymentStatus==='zapłacony'||c.paymentStatus==='anulowany') return false;
      var d = daysUntil(c.dueDate); return d!==null && d>=0 && d<=days;
    });
  }
  var overdue = STATE.costs.filter(function(c){
    if(c.paymentStatus==='zapłacony'||c.paymentStatus==='anulowany') return false;
    var d = daysUntil(c.dueDate); return d!==null && d<0;
  });

  var potentialSavingsMonthly =
    STATE.costs.filter(function(c){return c.excludeFromSimulation;}).reduce(function(s,c){return s+monthlyEquivalent(c);},0) +
    STATE.employees.filter(function(e){return e.excludeFromSimulation;}).reduce(function(s,e){return s+totalMonthlyCostEmployee(e);},0) +
    STATE.contracts.filter(function(c){return c.excludeFromSimulation;}).reduce(function(s,c){return s+monthlyEquivalentGeneric(c.amount,c.frequency);},0) +
    STATE.financings.filter(function(f){return f.excludeFromSimulation;}).reduce(function(s,f){return s+(Number(f.monthlyPayment)||0);},0);

  var monthlyProfit = monthlyRevenue - totalBurn;

  return {
    monthlyPayroll:monthlyPayroll, monthlyExternal:monthlyExternal, monthlyFinancing:monthlyFinancing,
    monthlyFixed:monthlyFixed, totalBurn:totalBurn, annualRunRate:annualRunRate,
    monthlyProjectCost:monthlyProjectCost, totalProjectCost:totalProjectCost,
    monthlyProjectRevenue:monthlyProjectRevenue, monthlyRevenue:monthlyRevenue,
    monthlyProfit:monthlyProfit, annualProfit:monthlyProfit*12,
    monthlyAdmin:monthlyAdmin, unassignedCosts:unassignedCosts, deptCost:deptCost,
    upcoming7:upcomingIn(7), upcoming30:upcomingIn(30), overdue:overdue,
    potentialSavingsMonthly:potentialSavingsMonthly, potentialSavingsAnnual:potentialSavingsMonthly*12,
    activeEmployees:activeEmployees
  };
}
function monthlyEquivalentGeneric(amount,freq){
  amount = Number(amount)||0;
  switch(freq){
    case 'miesięczny': return amount;
    case 'kwartalny': return amount/3;
    case 'półroczny': return amount/6;
    case 'roczny': return amount/12;
    default: return amount; // contracts default treat as monthly unless specified
  }
}

/* ============================= WARSTWA DANYCH (API -> PostgreSQL) ============================= */
function setSaveStatus(status,message){
  window.__saveStatus = status;
  var map = {
    idle: {text:'✓ Zapisano w PostgreSQL — widoczne na wszystkich urządzeniach', cls:'pill-ok', action:''},
    saving: {text:'Zapisywanie do bazy…', cls:'pill-muted', action:''},
    error: {text:'⚠ '+(message||'Błąd zapisu do bazy danych')+' — kliknij, aby odświeżyć', cls:'pill-danger', action:' onclick="location.reload()" style="cursor:pointer"'},
    loading: {text:'Wczytywanie danych…', cls:'pill-muted', action:''}
  };
  var m = map[status]||map.idle;
  var html = '<span class="pill '+m.cls+'"'+m.action+'>'+m.text+'</span>';
  ['save-status','save-status-mobile'].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.innerHTML = html;
  });
  if(status==='error'){ unlockModalSubmit(); }
}
window.addEventListener('beforeunload', function(ev){
  if(window.__saveStatus==='saving'){
    ev.preventDefault(); ev.returnValue = 'Trwa zapisywanie do bazy danych. Czy na pewno chcesz opuścić stronę?'; return ev.returnValue;
  }
});
// Zabezpieczenie przed podwójnym zapisem: blokuje przycisk "Zapisz" od razu
// po kliknięciu (np. przy szybkim, wielokrotnym wprowadzaniu danych), żeby
// nie powstały przypadkowo dwa identyczne wpisy w bazie. Odblokowuje się
// automatycznie po błędzie zapisu (patrz setSaveStatus powyżej) albo po
// 15 sekundach jako zabezpieczenie awaryjne.
function unlockModalSubmit(){
  var overlay = document.getElementById('modal-overlay');
  if(!overlay) return;
  overlay.querySelectorAll('button[type="submit"]').forEach(function(b){
    if(b.disabled){ b.disabled=false; b.textContent = b.dataset._origText || 'Zapisz'; }
  });
}
document.getElementById('modal-overlay').addEventListener('submit', function(ev){
  var btn = ev.target.querySelector('button[type="submit"]');
  if(btn && !btn.disabled){
    btn.disabled = true;
    btn.dataset._origText = btn.textContent;
    btn.textContent = 'Zapisywanie…';
    setTimeout(function(){ if(btn.isConnected && btn.disabled){ btn.disabled=false; btn.textContent = btn.dataset._origText||'Zapisz'; } }, 15000);
  }
}, true);

// Generyczne wywołanie API (fetch -> Next.js Route Handler -> Prisma -> PostgreSQL).
async function apiCall(method, url, body){
  setSaveStatus('saving');
  try{
    var res = await fetch(url, {
      method: method,
      headers: body!==undefined ? {'Content-Type':'application/json'} : undefined,
      body: body!==undefined ? JSON.stringify(body) : undefined
    });
    if(!res.ok){
      var errBody = null; try{ errBody = await res.json(); }catch(e){}
      throw new Error((errBody && errBody.message) || ('Błąd serwera (HTTP '+res.status+')'));
    }
    setSaveStatus('idle');
    if(res.status===204) return null;
    var text = await res.text();
    return text? JSON.parse(text) : null;
  }catch(e){
    setSaveStatus('error', e.message);
    throw e;
  }
}
async function refreshState(){
  var res = await fetch('/api/bootstrap', {cache:'no-store'});
  if(!res.ok) throw new Error('Nie udało się pobrać danych z serwera.');
  STATE = await res.json();
}
function afterMutation(promise){
  return promise.then(function(){ return refreshState(); }).then(render);
}

/* ============================= NAV ============================= */
var NAV = [
  {key:'dashboard',label:'Dashboard',icon:'📊'},
  {key:'employees',label:'Pracownicy',icon:'👤'},
  {key:'projects',label:'Projekty',icon:'🏗️'},
  {key:'costs',label:'Koszty',icon:'💰'},
  {key:'fixedcosts',label:'Koszty stałe',icon:'📌'},
  {key:'contracts',label:'Umowy i abonamenty',icon:'📄'},
  {key:'financing',label:'Leasingi / kredyty',icon:'🏦'},
  {key:'vendors',label:'Dostawcy',icon:'🏢'},
  {key:'payments',label:'Płatności',icon:'📅'},
  {key:'departments',label:'Działy / centra kosztów',icon:'🗂️'},
  {key:'analysis',label:'Analiza kosztów',icon:'📈'},
  {key:'simulator',label:'Symulator oszczędności',icon:'✂️'},
  {key:'documents',label:'Dokumenty',icon:'📎'},
  {key:'settings',label:'Ustawienia / słowniki',icon:'⚙️'}

// Autozapis wersji roboczej otwartego formularza do localStorage — zabezpieczenie
// na wypadek nieoczekiwanego zamknięcia/przeładowania karty w trakcie wpisywania
// danych (np. przez przeglądarkę mobilną w tle), zanim zdąży się kliknąć "Zapisz".
// Czyszczone przy normalnym zamknięciu modala (Zapisz / Anuluj / X) — więc
// "przeżywa" wyłącznie sytuację, w której strona zniknęła bez ostrzeżenia.
var CURRENT_DRAFT_KEY = null;
var DRAFT_TTL_MS = 7*24*60*60*1000; // wersje robocze starsze niż 7 dni są ignorowane
function draftSave(){
  if(!CURRENT_DRAFT_KEY) return;
  var f = document.querySelector('#modal form');
  if(!f) return;
  try{
    var fd = new FormData(f); var obj = {};
    fd.forEach(function(v,k){ obj[k]=v; });
    localStorage.setItem(CURRENT_DRAFT_KEY, JSON.stringify({savedAt:Date.now(), data:obj}));
  }catch(e){ /* localStorage niedostępny — po prostu brak autozapisu, bez błędu dla użytkownika */ }
}
function draftLoad(key){
  try{
    var raw = localStorage.getItem(key);
    if(!raw) return null;
    var parsed = JSON.parse(raw);
    if(!parsed || !parsed.data) return null;
    if(Date.now()-parsed.savedAt > DRAFT_TTL_MS){ localStorage.removeItem(key); return null; }
    return parsed;
  }catch(e){ return null; }
}
function draftClear(key){ try{ localStorage.removeItem(key); }catch(e){} }
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open'); document.getElementById('modal').innerHTML=''; pendingModalSave=null;
  if(CURRENT_DRAFT_KEY){ draftClear(CURRENT_DRAFT_KEY); CURRENT_DRAFT_KEY=null; }
}

// coll = nazwa kolekcji STATE, identyczna z segmentem REST API (/api/<coll>/<id>).
function deleteEntity(coll,id,label){
  if(!confirm('Usunąć pozycję: '+label+'?')) return;
  afterMutation(apiCall('DELETE','/api/'+coll+'/'+id)).catch(function(e){ alert('Nie udało się usunąć: '+e.message); });
}
function exportCsv(rows,headers,filename){
  var lines = [headers.map(function(h){return h.label;}).join(';')];
  rows.forEach(function(r){
    lines.push(headers.map(function(h){ var v=r[h.key]; return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }).join(';'));
  });
  var csv = lines.join('\n');
  downloadTextFile(filename, csv, 'text/csv;charset=utf-8');
}
function downloadTextFile(filename, content, mime){
  var blob = new Blob([content], {type: mime||'text/plain'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

/* ============================= PAYMENTS ============================= */
function viewPayments(){
  var groups = {zalegle:[],dzisiaj:[],d7:[],d14:[],d30:[],pozniej:[]};
  STATE.costs.forEach(function(c){
    if(c.paymentStatus==='zapłacony'||c.paymentStatus==='anulowany'||!c.dueDate) return;
    var d = daysUntil(c.dueDate);
    if(d<0) groups.zalegle.push(c);
    else if(d===0) groups.dzisiaj.push(c);
    else if(d<=7) groups.d7.push(c);
    else if(d<=14) groups.d14.push(c);
    else if(d<=30) groups.d30.push(c);
    else groups.pozniej.push(c);
  });
  function section(title,list,color){
    return '<div class="panel"'+(color?' style="border-color:'+color+'"':'')+'><h3'+(color?' style="color:'+color+'"':'')+'>'+title+' ('+list.length+') — '+fmtMoney0(list.reduce(function(s,c){return s+(Number(c.grossAmount)||0);},0))+'</h3>'+costsTable(list)+'</div>';
  }
  return '<h2 class="page-title">Płatności</h2><div class="page-sub">Terminarz zobowiązań spółki</div>'+
  section('⚠ Zaległe',groups.zalegle,'var(--danger)')+
  section('Dzisiaj',groups.dzisiaj,'var(--warn)')+
  section('W 7 dni',groups.d7)+
  section('W 14 dni',groups.d14)+
  section('W 30 dni',groups.d30)+
  section('Później',groups.pozniej);
}

/* ============================= ANALYSIS ============================= */
function viewAnalysis(){
  var m = metrics();
  var top20 = STATE.costs.slice().sort(function(a,b){return (Number(b.grossAmount)||0)-(Number(a.grossAmount)||0);}).slice(0,20);
  var top20fixed = STATE.costs.filter(function(c){return c.isFixed;}).slice().sort(function(a,b){return (Number(b.grossAmount)||0)-(Number(a.grossAmount)||0);}).slice(0,20);
  function groupSum(keyFn,labelFn){
    var g={};
    STATE.costs.forEach(function(c){ var k=keyFn(c); g[k]=(g[k]||0)+monthlyEquivalent(c); });
    return Object.keys(g).map(function(k){return {label:labelFn(k),value:g[k]};}).sort(function(a,b){return b.value-a.value;});
  }
  function table(rows){
    var total = rows.reduce(function(s,r){return s+r.value;},0);
    return '<table><thead><tr><th>Pozycja</th><th class="right">Kwota / mies.</th><th class="right">%</th></tr></thead><tbody>'+
    rows.map(function(r){return '<tr><td>'+esc(r.label)+'</td><td class="right">'+fmtMoney(r.value)+'</td><td class="right">'+(total?Math.round(r.value/total*100):0)+'%</td></tr>';}).join('')+
    '</tbody></table>';
  }
  var byEmp = STATE.employees.map(function(e){return {label:empName(e),value:totalMonthlyCostEmployee(e)};}).sort(function(a,b){return b.value-a.value;});
  var byVendor = groupSum(function(c){return c.vendorId||'brak';}, function(k){return k==='brak'?'Brak dostawcy':vendorName(k);});
  return '<h2 class="page-title">Analiza kosztów</h2><div class="page-sub">Cash burn: '+fmtMoney0(m.totalBurn)+'/mies. • Run-rate roczny: '+fmtMoney0(m.annualRunRate)+'</div>'+
  '<div class="kpi-grid">'+kpi('Miesięczny cash burn',fmtMoney0(m.totalBurn),true)+kpi('Roczny run-rate',fmtMoney0(m.annualRunRate),true)+kpi('Koszty stałe',fmtMoney0(m.monthlyFixed))+kpi('Koszty zmienne/zewnętrzne',fmtMoney0(m.monthlyExternal))+'</div>'+
  '<div class="grid2">'+
  '<div class="panel"><h3>TOP 20 największych kosztów</h3>'+costsTable(top20)+'</div>'+
  '<div class="panel"><h3>TOP 20 największych kosztów stałych</h3>'+costsTable(top20fixed)+'</div>'+
  '</div><div class="grid2">'+
  '<div class="panel"><h3>Koszt wg kategorii</h3>'+table(groupSum(function(c){return c.category||'Inne';},function(k){return k;}))+'</div>'+
  '<div class="panel"><h3>Koszt wg projektu</h3>'+table(Object.keys(m.monthlyProjectCost).map(function(k){return {label:projectName(k),value:m.monthlyProjectCost[k]};}).sort(function(a,b){return b.value-a.value;}))+'</div>'+
  '</div><div class="grid2">'+
  '<div class="panel"><h3>Koszt wg działu</h3>'+table(Object.keys(m.deptCost).map(function(k){return {label:deptName(k),value:m.deptCost[k].total};}).sort(function(a,b){return b.value-a.value;}))+'</div>'+
  '<div class="panel"><h3>Koszt wg pracownika</h3>'+table(byEmp)+'</div>'+
  '</div>'+
  '<div class="panel"><h3>Koszt wg dostawcy</h3>'+table(byVendor)+'</div>';
}

/* ============================= SIMULATOR ============================= */
function viewSimulator(){
  var m = metrics();
  var newTotal = m.totalBurn - m.potentialSavingsMonthly;
  var pct = m.totalBurn>0? Math.round(m.potentialSavingsMonthly/m.totalBurn*100):0;
  var selCosts = STATE.costs.filter(function(c){return c.excludeFromSimulation;});
  var selEmp = STATE.employees.filter(function(e){return e.excludeFromSimulation;});
  var selContracts = STATE.contracts.filter(function(c){return c.excludeFromSimulation;});
  var selFin = STATE.financings.filter(function(f){return f.excludeFromSimulation;});
  return '<h2 class="page-title">Symulator oszczędności</h2><div class="page-sub">Zaznacz koszty, pracowników, umowy lub leasingi do redukcji, aby zobaczyć wpływ na budżet spółki.</div>'+
  '<div class="grid3">'+
    kpi('Obecny koszt miesięczny',fmtMoney0(m.totalBurn),true)+
    kpi('Planowane redukcje / mies.',fmtMoney0(m.potentialSavingsMonthly))+
    kpi('Nowy koszt miesięczny',fmtMoney0(newTotal),true)+
  '</div>'+
  '<div class="grid3">'+
    kpi('Oszczędność roczna',fmtMoney0(m.potentialSavingsAnnual))+
    kpi('Procent redukcji',pct+'%')+
    kpi('Nowy koszt roczny',fmtMoney0(newTotal*12))+
  '</div>'+
  '<div class="panel"><h3>Zaznaczeni pracownicy do redukcji</h3>'+(selEmp.length?'<table><tbody>'+selEmp.map(function(e){return '<tr><td>'+esc(empName(e))+'</td><td>'+esc(e.position)+'</td><td class="right">'+fmtMoney(totalMonthlyCostEmployee(e))+'/mies.</td><td><span class="link" onclick="toggleSimEmp(\''+e.id+'\')">usuń z symulacji</span></td></tr>';}).join('')+'</tbody></table>':'<div class="empty">Brak — oznacz pracownika w jego karcie „Uwzględnij w symulatorze”.</div>')+'</div>'+
  '<div class="panel"><h3>Zaznaczone koszty / abonamenty do redukcji</h3>'+(selCosts.length?costsTable(selCosts):'<div class="empty">Brak — oznacz koszt jako „Uwzględnij w symulatorze” w formularzu kosztu.</div>')+'</div>'+
  (selContracts.length?'<div class="panel"><h3>Zaznaczone umowy do wypowiedzenia</h3>'+selContracts.map(function(c){return '<div>'+esc(c.name)+' — '+fmtMoney(monthlyEquivalentGeneric(c.amount,c.frequency))+'/mies.</div>';}).join('')+'</div>':'')+
  (selFin.length?'<div class="panel"><h3>Zaznaczone leasingi / kredyty do zakończenia</h3>'+selFin.map(function(f){return '<div>'+esc(f.lender)+' — '+fmtMoney(f.monthlyPayment)+'/mies.</div>';}).join('')+'</div>':'')+
  '<div class="panel"><h3>Wszystkie pozycje — szybkie zaznaczanie</h3><div class="section-title" style="margin-top:0">Pracownicy</div><table><tbody>'+
  STATE.employees.map(function(e){return '<tr><td><label><input type="checkbox" style="width:auto" '+(e.excludeFromSimulation?'checked':'')+' onchange="toggleSimEmp(\''+e.id+'\')"> '+esc(empName(e))+'</label></td><td class="right">'+fmtMoney(totalMonthlyCostEmployee(e))+'</td></tr>';}).join('')+
  '</tbody></table><div class="section-title">Koszty</div><table><tbody>'+
  STATE.costs.map(function(c){return '<tr><td><label><input type="checkbox" style="width:auto" '+(c.excludeFromSimulation?'checked':'')+' onchange="toggleSimCost(\''+c.id+'\')"> '+esc(c.name)+'</label></td><td class="right">'+fmtMoney(monthlyEquivalent(c))+'</td></tr>';}).join('')+
  '</tbody></table></div>';
}
function toggleSimEmp(id){
  var e = byId(STATE.employees,id); if(!e) return;
  var obj = Object.assign({}, e, {excludeFromSimulation: !e.excludeFromSimulation});
  afterMutation(apiCall('PUT','/api/employees/'+id, obj)).catch(function(e2){ alert('Nie udało się zaktualizować: '+e2.message); });
}
function toggleSimCost(id){
  var c = byId(STATE.costs,id); if(!c) return;
  var obj = Object.assign({}, c, {excludeFromSimulation: !c.excludeFromSimulation});
  afterMutation(apiCall('PUT','/api/costs/'+id, obj)).catch(function(e2){ alert('Nie udało się zaktualizować: '+e2.message); });
}

  '<label>Opis</label><textarea name="description">'+esc(d.description)+'</textarea>'+

function saveDocument(ev,id){
  ev.preventDefault(); var f=new FormData(ev.target);
  var obj = {name:f.get('name'),link:f.get('link'),docType:f.get('docType'),date:f.get('date'),description:f.get('description'),externalSource:'',externalId:'',sharePointUrl:'',documentUrl:f.get('link')};
  var url = id? '/api/documents/'+id : '/api/documents';
  afterMutation(apiCall(id?'PUT':'POST', url, obj)).then(closeModal)
    .catch(function(e){ alert('Nie udało się zapisać dokumentu: '+e.message); });
  return false;
}

  '</div>'+

  '</div>'+
  '<div class="grid2">'+
  '<div class="panel"><h3>Kategorie kosztów</h3>'+dictList('costCategories')+'</div>'+
  '<div class="panel"><h3>Centra kosztów</h3>'+dictList('costCenters')+'</div>'+

function dictList(key){
  return '<div id="dict-'+key+'">'+STATE[key].map(function(v,i){
    return '<div style="display:flex;gap:6px;align-items:center;margin-bottom:5px"><span style="flex:1">'+esc(v)+'</span><span class="link" onclick="removeDictItem(\''+key+'\','+i+')">usuń</span></div>';
  }).join('')+'</div><div style="display:flex;gap:6px;margin-top:8px"><input id="new-'+key+'" placeholder="Nowa pozycja"><button class="btn btn-sm" onclick="addDictItem(\''+key+'\')">Dodaj</button></div>';
}
function addDictItem(key){
  var el = document.getElementById('new-'+key); var v = el.value.trim();
  if(!v) return;
  var newList = STATE[key].concat([v]);
  afterMutation(apiCall('PUT','/api/settings',{key:key,value:newList})).then(function(){ el.value=''; })
    .catch(function(e){ alert('Nie udało się zapisać: '+e.message); });
}
function removeDictItem(key,i){
  var newList = STATE[key].slice(); newList.splice(i,1);
  afterMutation(apiCall('PUT','/api/settings',{key:key,value:newList})).catch(function(e){ alert('Nie udało się zapisać: '+e.message); });
}
function setCurrency(){
  var sel = document.querySelector('#content select[name=currency]');
  afterMutation(apiCall('PUT','/api/settings',{key:'currency',value:sel.value})).catch(function(e){ alert('Nie udało się zapisać: '+e.message); });
}
function removeDemoData(){
  if(!confirm('Usunąć wszystkie dane DEMO z aplikacji?')) return;
  afterMutation(apiCall('DELETE','/api/demo')).catch(function(e){ alert('Nie udało się usunąć danych DEMO: '+e.message); });
}
function exportBackupJson(){
  var json = JSON.stringify(STATE, null, 2);
  downloadTextFile('ffp-cost-control-backup-'+todayISO()+'.json', json, 'application/json');
}
function importBackupJsonFile(input){
  var file = input.files && input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var data;
    try{
      data = JSON.parse(reader.result);
      if(!data || typeof data!=='object') throw new Error('bad format');
    }catch(e){ alert('Nieprawidłowy plik kopii zapasowej.'); input.value=''; return; }
    if(!confirm('Zastąpić WSZYSTKIE obecne dane w bazie PostgreSQL danymi z pliku kopii zapasowej? Tej operacji nie można cofnąć.')){ input.value=''; return; }
    afterMutation(apiCall('POST','/api/restore', data))
      .then(function(){ alert('Przywrócono dane z kopii zapasowej.'); })
      .catch(function(e){ alert('Nie udało się przywrócić kopii: '+e.message); });
    input.value = '';
  };
  reader.readAsText(file);
}

/* --------- Automatyczne kopie zapasowe / punkty przywracania --------- */
var BACKUPS_LIST = null; // null = jeszcze nie wczytano, 'loading' = w trakcie, [] / [...] = gotowe

function ensureBackupsLoaded(force){
  if(BACKUPS_LIST!==null && !force) return;
  BACKUPS_LIST = 'loading';
  fetch('/api/admin/backups').then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(list){ BACKUPS_LIST = list; if(currentTab==='settings') render(); })
    .catch(function(){ BACKUPS_LIST = []; if(currentTab==='settings') render(); });
}
function fmtBackupDate(iso){
  var d = new Date(iso);
  if(isNaN(d.getTime())) return iso;
  function p2(n){ return (n<10?'0':'')+n; }
  return p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes());
}
function renderBackupsList(){
  if(BACKUPS_LIST===null || BACKUPS_LIST==='loading'){
    return '<div class="muted">Wczytywanie listy kopii…</div>';
  }
  if(!BACKUPS_LIST.length){
    return '<div class="muted">Brak zapisanych kopii — pierwsza automatyczna kopia pojawi się w ciągu kilku godzin, albo utwórz ją teraz przyciskiem powyżej.</div>';
  }
  return '<table><thead><tr><th>Data i godzina</th><th>Typ</th><th>Pracownicy</th><th>Projekty</th><th>Koszty</th><th>Dostawcy</th><th></th></tr></thead><tbody>'+
    BACKUPS_LIST.map(function(b){
      return '<tr><td>'+fmtBackupDate(b.createdAt)+'</td>'+
        '<td>'+(b.kind==='manual'?'ręczna':'automatyczna')+'</td>'+
        '<td>'+b.counts.employees+'</td><td>'+b.counts.projects+'</td><td>'+b.counts.costs+'</td><td>'+b.counts.vendors+'</td>'+
        '<td style="white-space:nowrap"><span class="link" onclick="downloadBackupPoint(\''+b.id+'\')">pobierz</span> · <span class="link" style="color:#b91c1c" onclick="restoreBackupPoint(\''+b.id+'\')">przywróć</span></td></tr>';
    }).join('')+
    '</tbody></table>';
}
function createManualBackupNow(){
  apiCall('POST','/api/admin/backups').then(function(){ ensureBackupsLoaded(true); alert('Utworzono kopię zapasową.'); })
    .catch(function(e){ alert('Nie udało się utworzyć kopii: '+e.message); });
}
function downloadBackupPoint(id){
  fetch('/api/admin/backups/'+id).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(data){
    downloadTextFile('ffp-cost-control-backup-'+id+'.json', JSON.stringify(data,null,2), 'application/json');
  }).catch(function(e){ alert('Nie udało się pobrać kopii: '+e.message); });
}
function restoreBackupPoint(id){
  if(!confirm('Przywrócić dane do tego punktu? WSZYSTKIE obecne dane w bazie zostaną zastąpione danymi z tej kopii. Tej operacji nie można cofnąć.')) return;
  afterMutation(apiCall('POST','/api/admin/backups/'+id+'/restore'))
    .then(function(){ alert('Przywrócono dane do wybranego punktu.'); })
    .catch(function(e){ alert('Nie udało się przywrócić kopii: '+e.message); });
}

/* ============================= FORM DISPATCH ============================= */
var ENTITY_STATE_KEY = {employees:'employees',projects:'projects',costs:'costs',contracts:'contracts',financing:'financings',vendors:'vendors',documents:'documents'};
function openForm(entity,id,defaults){
  var stateKey = ENTITY_STATE_KEY[entity]||entity;
  var item = id?byId(STATE[stateKey],id):null;
  var html;
  if(entity==='employees') html = employeeForm(item);
  else if(entity==='projects') html = projectForm(item);
  else if(entity==='costs') html = costForm(item,defaults);
  else if(entity==='contracts') html = contractForm(item);
  else if(entity==='financing') html = financingForm(item);
  else if(entity==='vendors') html = vendorForm(item);
  else if(entity==='documents') html = documentForm(item);
  else return;
  openModalHtml(html);
  if(entity==='employees') renderAllocRows();

  CURRENT_DRAFT_KEY = 'ffp_draft_'+entity+'_'+(id||'new');
  var draft = draftLoad(CURRENT_DRAFT_KEY);
  if(draft){
    var savedDate = new Date(draft.savedAt);
    var p2=function(n){return (n<10?'0':'')+n;};
    var whenStr = p2(savedDate.getDate())+'.'+p2(savedDate.getMonth()+1)+'.'+savedDate.getFullYear()+' '+p2(savedDate.getHours())+':'+p2(savedDate.getMinutes());
    if(confirm('Znaleziono niezapisaną wersję roboczą tego formularza z '+whenStr+' (np. po nieoczekiwanym zamknięciu karty). Przywrócić ją?')){
      var f = document.querySelector('#modal form');
      if(f){
        Object.keys(draft.data).forEach(function(k){
          var el = f.elements.namedItem(k);
          if(!el) return;
          if(el.type==='checkbox'){ el.checked = (draft.data[k]==='on'); }
          else { el.value = draft.data[k]; }
        });
      }
    } else {
      draftClear(CURRENT_DRAFT_KEY);
    }
  }
}

/* ============================= INIT ============================= */
document.getElementById('modal-overlay').addEventListener('input', draftSave);
document.getElementById('modal-overlay').addEventListener('change', draftSave);
async function boot(){
  setSaveStatus('loading');
  try{
    await refreshState();
    BOOTED = true;
    render();
    setSaveStatus('idle');
  }catch(e){
    document.getElementById('content').innerHTML = '<div class="panel" style="border-color:var(--danger)"><h3 style="color:var(--danger)">Nie udało się połączyć z bazą danych</h3><div>'+esc(e.message)+'</div><button class="btn" style="margin-top:10px" onclick="boot()">Spróbuj ponownie</button></div>';
    setSaveStatus('error','Brak połączenia z bazą');
  }
}
boot();
