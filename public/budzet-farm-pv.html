      btn.addEventListener("click", function () { state.resultsGranularity = btn.getAttribute("data-gran"); renderResults(); });

  function buildCashflowChart(m, granularity) {
    var canvas = document.getElementById("chart-cashflow");
    if (!canvas || typeof Chart === "undefined") return;
    if (chartRefs.cashflow) chartRefs.cashflow.destroy();

    var text = getCSSVar("--text-muted");
    var border = getCSSVar("--border");
    var positive = getCSSVar("--positive");
    var negative = getCSSVar("--negative");
    var accent2 = getCSSVar("--accent-2");

    var source = granularity === "monthly" ? m.monthRows : m.yearRows;
    var labels = granularity === "monthly"
      ? source.map(function (r) { return r.monthName.slice(0, 3) + " " + String(r.year).slice(2); })
      : source.map(function (r) { return "Rok " + r.year; });
    var cf = source.map(function (r) { return Math.round(r.equityFCFOperating); });

  /* ============================================================

  /** Earliest "start of production" date across a project's enabled
   *  technologies — PV is always present, storage only counts if enabled —
   *  used by the portfolio Gantt chart to show time-to-launch. Reads the
   *  commissioning fields directly off the project rather than running the
   *  full computeMetrics, since that's all a launch-date lookup needs. */
  function projectCommissioning(p) {
    var c = { year: Math.round(num(p.pv.commissioning_year, 2026)), month: clamp(Math.round(num(p.pv.commissioning_month, 1)), 1, 12) };
    if (p.storage && p.storage.enabled) {
      var sc = { year: Math.round(num(p.storage.commissioning_year, c.year)), month: clamp(Math.round(num(p.storage.commissioning_month, 1)), 1, 12) };
      if (monthDiff(c.year, c.month, sc.year, sc.month) < 0) c = sc;
    }
    return c;
  }

  function buildCompareCharts(rows) {
    if (typeof Chart === "undefined") return;
    var text = getCSSVar("--text-muted");
    var border = getCSSVar("--border");
    var positive = getCSSVar("--positive");
    var negative = getCSSVar("--negative");
    var accent = getCSSVar("--accent");
    var labels = rows.map(function (r) { return r.p.name || "Bez nazwy"; });
    var irrData = rows.map(function (r) { return r.m && r.m.irrEquity !== null ? +(r.m.irrEquity * 100).toFixed(2) : 0; });
    var npvData = rows.map(function (r) { return r.m && r.m.npvEquity !== null ? Math.round(r.m.npvEquity) : 0; });
    // Each chart is built in its own try/catch: a problem building one (e.g.
    // an unexpected value, a destroyed-canvas edge case) must not silently
    // leave the *other* chart blank too, and must not abort the rest of
    // renderCompare (the portfolio chart/table) which runs right after this.
    var canvasIrr = document.getElementById("chart-cmp-irr");
    if (chartRefs.cmpIrr) { try { chartRefs.cmpIrr.destroy(); } catch (eDestroy1) {} }
    if (canvasIrr) {
      try {
        chartRefs.cmpIrr = new Chart(canvasIrr.getContext("2d"), {
          type: "bar",
          data: { labels: labels, datasets: [{ label: "IRR equity (%)", data: irrData, backgroundColor: irrData.map(function (v) { return v >= 0 ? positive : negative; }), borderRadius: 4 }] },
          options: {
            indexAxis: "y", responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { callbacks: { label: function (ctx) { return ctx.parsed.x + "%"; } } } },
            scales: {
              x: { ticks: { color: text, callback: function (v) { return v + "%"; } }, grid: { color: border } },
              y: { ticks: { color: text }, grid: { display: false } }
            }
          }
        });
      } catch (eIrr) { /* leave this one canvas blank rather than breaking the rest of the view */ }
    }

    var canvasNpv = document.getElementById("chart-cmp-npv");
    if (chartRefs.cmpNpv) { try { chartRefs.cmpNpv.destroy(); } catch (eDestroy2) {} }
    if (canvasNpv) {
      try {
        chartRefs.cmpNpv = new Chart(canvasNpv.getContext("2d"), {
          type: "bar",
          data: { labels: labels, datasets: [{ label: "NPV equity (PLN)", data: npvData, backgroundColor: accent, borderRadius: 4 }] },
          options: {
            indexAxis: "y", responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { callbacks: { label: function (ctx) { return fmt(ctx.parsed.x, 0) + " PLN"; } } } },
            scales: {
              x: { ticks: { color: text, callback: function (v) { return fmt(v, 0); } }, grid: { color: border } },
              y: { ticks: { color: text }, grid: { display: false } }
            }
          }
        });
      } catch (eNpv) { /* leave this one canvas blank rather than breaking the rest of the view */ }
    }

    var canvasGantt = document.getElementById("chart-cmp-gantt");
    if (chartRefs.cmpGantt) { try { chartRefs.cmpGantt.destroy(); } catch (eDestroy3) {} }
    if (canvasGantt) {
      try {
        var now = new Date();
        var nowY = now.getFullYear(), nowM = now.getMonth() + 1;
        var ganttItems = rows.map(function (r) {
          var c = projectCommissioning(r.p);
          return { name: r.p.name || "Bez nazwy", c: c, monthsToStart: monthDiff(nowY, nowM, c.year, c.month) };
        }).sort(function (a, b) { return a.monthsToStart - b.monthsToStart; });
        var ganttLabels = ganttItems.map(function (it) { return it.name; });
        // Already-commissioned projects (monthsToStart <= 0) get a short
        // marker bar right at "dziś" rather than a bar reaching into
        // negative territory — the axis is anchored to start at the current
        // month (min: 0 below), matching "zaczynający się od aktualnego
        // miesiąca" — and are colored differently so they read as "already
        // running" rather than "about to launch".
        var ganttRanges = ganttItems.map(function (it) { return it.monthsToStart > 0 ? [0, it.monthsToStart] : [0, 0.4]; });
        var ganttColors = ganttItems.map(function (it) { return it.monthsToStart > 0 ? accent : positive; });
        chartRefs.cmpGantt = new Chart(canvasGantt.getContext("2d"), {
          type: "bar",
          data: { labels: ganttLabels, datasets: [{ label: "Czas do uruchomienia", data: ganttRanges, backgroundColor: ganttColors, borderRadius: 4, barThickness: 16 }] },
          options: {
            indexAxis: "y", responsive: true, maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: function (ctx) {
                    var it = ganttItems[ctx.dataIndex];
                    var dateLabel = MONTH_NAMES_PL[it.c.month - 1] + " " + it.c.year;
                    if (it.monthsToStart > 0) return "Uruchomienie: " + dateLabel + " (za " + it.monthsToStart + " mies.)";
                    if (it.monthsToStart === 0) return "Uruchomienie: " + dateLabel + " (ten miesiąc)";
                    return "Uruchomienie: " + dateLabel + " (w eksploatacji od " + (-it.monthsToStart) + " mies.)";
                  }
                }
              }
            },
            scales: {
              x: {
                min: 0,
                ticks: {
                  color: text,
                  callback: function (v) {
                    var d = addMonths(nowY, nowM, Math.round(v));
                    return MONTH_NAMES_PL[d.month - 1].slice(0, 3) + " " + d.year;
                  }
                },
                grid: { color: border }
              },
              y: { ticks: { color: text }, grid: { display: false } }
            }
          }
        });
      } catch (eGantt) { /* leave this one canvas blank rather than breaking the rest of the view */ }
    }
  }

  /** The monthly/annual data table under the portfolio chart: the actual
   *  "zestawienie liczb" the user can scan to see exactly which period the
   *  portfolio's cumulative equity CF (net of company fixed costs) crosses
   *  zero — the BEP row is highlighted, not just marked on the chart. */
  function renderPortfolioTable(agg, granularity) {
    var container = document.getElementById("portfolio-table");
    if (!container) return;
    var split = !!agg.hasAnyStorage;
    var prodTh = split ? "<th>Produkcja PV (MWh)</th><th>Produkcja magazyn (MWh)</th>" : "<th>Produkcja (MWh)</th>";
    function prodTd(r) {
      return split
        ? '<td class="num">' + fmt(r.productionPv, 0) + '</td><td class="num">' + fmt(r.productionStorage, 0) + '</td>'
        : '<td class="num">' + fmt(r.production, 0) + '</td>';
    }
    if (granularity === "monthly") {
      var rows = agg.monthRows.slice(0, 60);
      var body = rows.map(function (r, idx) {
        var isBep = agg.bep && (idx + 1) === agg.bep.indexFromStart;
        return '<tr class="' + (isBep ? "bep-row" : "") + '"><td>' + r.year + " " + r.monthName + (isBep ? ' <span class="bep-flag">BEP</span>' : "") + '</td>' +
          prodTd(r) +
          '<td class="num">' + fmt(r.revenue, 0) + '</td>' +
          '<td class="num">' + fmt(r.opex, 0) + '</td>' +
          '<td class="num">' + fmt(r.ebitda, 0) + '</td>' +
          '<td class="num">' + fmt(r.debtPayment, 0) + '</td>' +
          '<td class="num ' + (r.equityFCFOperating < 0 ? "neg" : "") + '">' + fmt(r.equityFCFOperating, 0) + '</td>' +
          '<td class="num neg">' + (r.fixedCost > 0 ? "−" + fmt(r.fixedCost, 0) : "0") + '</td>' +
          '<td class="num ' + (r.equityFCFNetOperating < 0 ? "neg" : "") + '">' + fmt(r.equityFCFNetOperating, 0) + '</td>' +
          '<td class="num ' + (r.cumEquityNetOperating < 0 ? "neg" : "") + '">' + fmt(r.cumEquityNetOperating, 0) + '</td>' +
          '<td class="num ' + (r.cumEquity < 0 ? "neg" : "") + '">' + fmt(r.cumEquity, 0) + '</td>' +
          '<td class="num">' + (r.equityOut > 0 ? fmt(r.equityOut, 0) : "0") + '</td></tr>';
      }).join("");
      container.innerHTML = '<div class="table-scroll"><table class="datatable"><thead><tr>' +
        '<th>Miesiąc</th>' + prodTh + '<th>Przychód (PLN)</th><th>OPEX (PLN)</th><th>EBITDA (PLN)</th>' +
        '<th>Rata długu (PLN)</th><th>CF equity — farmy (PLN)</th><th>Koszty stałe spółki (PLN)</th><th>CF equity netto (PLN)</th><th>CF equity netto skumulowane (bez wkładu własnego)</th><th>CF equity skumulowany</th><th>Wkład własny (PLN)</th>' +
        '</tr></thead><tbody>' + body + '</tbody></table></div>' +
        '<div class="assumption-note">Kolumna „Wkład własny” pokazuje łączną wpłatę kapitału własnego (wszystkich wybranych farm, z uwzględnieniem mnożników) w danym okresie osobno — kolumny „CF equity — farmy” / „CF equity netto” pokazują operacyjny cash flow equity (BEZ wkładu własnego). „CF equity netto skumulowane (bez wkładu własnego)” to narastająca suma tej samej operacyjnej kolumny — ile gotówki wróciło z samej działalności, bez uznania wpłaconego kapitału — podczas gdy „CF equity skumulowany” uwzględnia pełny wkład własny (na jego podstawie liczone są IRR/NPV/payback kapitału własnego oraz próg rentowności BEP), więc te dwie skumulowane kolumny nie są sobie równe. Pokazano pierwsze 5 lat (60 miesięcy) licząc od pierwszej inwestycji w portfelu. Pełne dane dla całego horyzontu dostępne są w eksporcie CSV/Excel.</div>';
    } else {
      var body2 = agg.yearRows.map(function (r) {
        return '<tr class="' + (r.isBep ? "bep-row" : "") + '"><td>' + r.year + (r.isBep ? ' <span class="bep-flag">BEP</span>' : "") + '</td>' +
          prodTd(r) +
          '<td class="num">' + fmt(r.revenue, 0) + '</td>' +
          '<td class="num">' + fmt(r.opex, 0) + '</td>' +
          '<td class="num">' + fmt(r.ebitda, 0) + '</td>' +
          '<td class="num">' + fmt(r.debtPayment, 0) + '</td>' +
          '<td class="num ' + (r.equityFCFOperating < 0 ? "neg" : "") + '">' + fmt(r.equityFCFOperating, 0) + '</td>' +
          '<td class="num neg">' + (r.fixedCost > 0 ? "−" + fmt(r.fixedCost, 0) : "0") + '</td>' +
          '<td class="num ' + (r.equityFCFNetOperating < 0 ? "neg" : "") + '">' + fmt(r.equityFCFNetOperating, 0) + '</td>' +
          '<td class="num ' + (r.cumEquityNetOperating < 0 ? "neg" : "") + '">' + fmt(r.cumEquityNetOperating, 0) + '</td>' +
          '<td class="num ' + (r.cumEquity < 0 ? "neg" : "") + '">' + fmt(r.cumEquity, 0) + '</td>' +
          '<td class="num">' + (r.equityOut > 0 ? fmt(r.equityOut, 0) : "0") + '</td>' +
          '<td class="num">' + (r.dscr !== null ? r.dscr.toFixed(2) : "–") + '</td></tr>';
      }).join("");
      container.innerHTML = '<div class="table-scroll"><table class="datatable"><thead><tr>' +
        '<th>Rok</th>' + prodTh + '<th>Przychód (PLN)</th><th>OPEX (PLN)</th><th>EBITDA (PLN)</th>' +
        '<th>Rata długu (PLN)</th><th>CF equity — farmy (PLN)</th><th>Koszty stałe spółki (PLN)</th><th>CF equity netto (PLN)</th><th>CF equity netto skumulowane (bez wkładu własnego)</th><th>CF equity skumulowany</th><th>Wkład własny (PLN)</th><th>DSCR</th>' +
        '</tr></thead><tbody>' + body2 + '</tbody></table></div>' +
        '<div class="assumption-note">„CF equity netto skumulowane (bez wkładu własnego)” to narastająca suma operacyjnego CF equity (bez wkładu własnego) — ile gotówki wróciło z samej działalności portfela, bez uznania wpłaconego kapitału. „CF equity skumulowany” uwzględnia natomiast pełny wkład własny i jest podstawą IRR/NPV/payback kapitału własnego oraz progu rentowności (BEP), więc te dwie skumulowane kolumny nie są sobie równe.</div>';
    }
  }

  /** Row definitions for the full-form (not abbreviated) portfolio RZiS —
   *  Rachunek zysków i strat, wariant porównawczy, laid out exactly per
   *  Załącznik nr 1 do ustawy o rachunkowości (letters A–L for the major
   *  captions, roman numerals for their sub-items — the sub-numbering
   *  restarts under each letter, same as in the statute itself). Every
   *  statutory line is included even when it is always 0 for a PV/BESS SPV
   *  portfolio with no inventory, trading goods or financial investments —
   *  that completeness is the point of the "full form" versus the earlier
   *  abbreviated summary. Two lines below "L." are NOT part of the statutory
   *  form: company-wide fixed costs (head office/administration) sit outside
   *  any single project's own taxable result in this model (see
   *  computePortfolioAggregate), so they are shown as a clearly separated
   *  reconciliation down to the portfolio's actual bottom line, rather than
   *  folded into "B." where they would silently misstate "J. Podatek
   *  dochodowy" (which is computed on the projects' own taxable income only). */
  function statutoryPnLRows() {
    var z = function () { return 0; };
    return [
      { label: "A. Przychody netto ze sprzedaży i zrównane z nimi, w tym:", major: true, value: function (r) { return r.revenue; } },
      { label: "I. Przychody netto ze sprzedaży produktów", sub: true, value: function (r) { return r.revenue; } },
      { label: "II. Zmiana stanu produktów", sub: true, value: z },
      { label: "III. Koszt wytworzenia produktów na własne potrzeby jednostki", sub: true, value: z },
      { label: "IV. Przychody netto ze sprzedaży towarów i materiałów", sub: true, value: z },
      { label: "B. Koszty działalności operacyjnej", major: true, value: function (r) { return r.depreciation + r.opex; } },
      { label: "I. Amortyzacja", sub: true, value: function (r) { return r.depreciation; } },
      { label: "II. Zużycie materiałów i energii", sub: true, value: z },
      { label: "III. Usługi obce", sub: true, value: function (r) { return r.opexServices; } },
      { label: "IV. Podatki i opłaty, w tym podatek akcyzowy", sub: true, value: function (r) { return r.opexTaxes; } },
      { label: "V. Wynagrodzenia", sub: true, value: z },
      { label: "VI. Ubezpieczenia społeczne i inne świadczenia", sub: true, value: z },
      { label: "VII. Pozostałe koszty rodzajowe", sub: true, value: z },
      { label: "VIII. Wartość sprzedanych towarów i materiałów", sub: true, value: z },
      { label: "C. Zysk (strata) ze sprzedaży (A−B)", major: true, value: function (r) { return r.revenue - (r.depreciation + r.opex); } },
      { label: "D. Pozostałe przychody operacyjne", major: true, value: z },
      { label: "I. Zysk z tytułu rozchodu niefinansowych aktywów trwałych", sub: true, value: z },
      { label: "II. Dotacje", sub: true, value: z },
      { label: "III. Aktualizacja wartości aktywów niefinansowych", sub: true, value: z },
      { label: "IV. Inne przychody operacyjne", sub: true, value: z },
      { label: "E. Pozostałe koszty operacyjne", major: true, value: z },
      { label: "I. Strata z tytułu rozchodu niefinansowych aktywów trwałych", sub: true, value: z },
      { label: "II. Aktualizacja wartości aktywów niefinansowych", sub: true, value: z },
      { label: "III. Inne koszty operacyjne", sub: true, value: z },
      { label: "F. Zysk (strata) z działalności operacyjnej (C+D−E)", major: true, value: function (r) { return r.ebitda - r.depreciation; } },
      { label: "G. Przychody finansowe", major: true, value: z },
      { label: "I. Dywidendy i udziały w zyskach", sub: true, value: z },
      { label: "II. Odsetki", sub: true, value: z },
      { label: "III. Zysk z tytułu rozchodu aktywów finansowych", sub: true, value: z },
      { label: "IV. Aktualizacja wartości aktywów finansowych", sub: true, value: z },
      { label: "V. Inne", sub: true, value: z },
      { label: "H. Koszty finansowe", major: true, value: function (r) { return r.interest; } },
      { label: "I. Odsetki", sub: true, value: function (r) { return r.interest; } },
      { label: "II. Strata z tytułu rozchodu aktywów finansowych", sub: true, value: z },
      { label: "III. Aktualizacja wartości aktywów finansowych", sub: true, value: z },
      { label: "IV. Inne", sub: true, value: z },
      { label: "I. Zysk (strata) brutto (F+G−H)", major: true, value: function (r) { return r.ebitda - r.depreciation - r.interest; } },
      { label: "J. Podatek dochodowy", major: true, value: function (r) { return r.tax; } },
      { label: "K. Pozostałe obowiązkowe zmniejszenia zysku (zwiększenia straty)", major: true, value: z },
      { label: "L. Zysk (strata) netto z działalności projektów (I−J−K)", major: true, final: true, value: function (r) { return r.ebitda - r.depreciation - r.interest - r.tax; } },
      { label: "Koszty stałe spółki (zarząd, administracja — poziom portfela, poza jednostkowym RZiS projektu)", reconcile: true, value: function (r) { return -r.fixedCost; } },
      { label: "Wynik netto portfela razem (skonsolidowany)", major: true, final: true, value: function (r) { return r.netIncome; } }
    ];
  }

  /** Row definitions for the full-form portfolio Bilans, per Załącznik nr 1
   *  (Aktywa, then Pasywa) — same completeness rationale as the RZiS above.
   *  See computePortfolioAggregate for the derivation of fixedAssetsNet /
   *  cash / debtBalance / debtShortTerm / debtLongTerm / equity fields;
   *  Aktywa razem always equals Pasywa razem by construction. */
  function statutoryBalanceRows() {
    var z = function () { return 0; };
    return [
      { label: "AKTYWA", header: true },
      { label: "A. Aktywa trwałe", major: true, value: function (r) { return r.fixedAssetsNet; } },
      { label: "I. Wartości niematerialne i prawne", sub: true, value: z },
      { label: "II. Rzeczowe aktywa trwałe", sub: true, value: function (r) { return r.fixedAssetsNet; } },
      { label: "III. Należności długoterminowe", sub: true, value: z },
      { label: "IV. Inwestycje długoterminowe", sub: true, value: z },
      { label: "V. Długoterminowe rozliczenia międzyokresowe", sub: true, value: z },
      { label: "B. Aktywa obrotowe", major: true, value: function (r) { return r.cash; } },
      { label: "I. Zapasy", sub: true, value: z },
      { label: "II. Należności krótkoterminowe", sub: true, value: z },
      { label: "III. Inwestycje krótkoterminowe (środki pieniężne i inne aktywa pieniężne)", sub: true, value: function (r) { return r.cash; } },
      { label: "IV. Krótkoterminowe rozliczenia międzyokresowe", sub: true, value: z },
      { label: "AKTYWA RAZEM", major: true, final: true, value: function (r) { return r.assets; } },
      { label: "PASYWA", header: true },
      { label: "A. Kapitał (fundusz) własny", major: true, value: function (r) { return r.equityTotal; } },
      { label: "I. Kapitał (fundusz) podstawowy", sub: true, value: function (r) { return r.contributedCapital; } },
      { label: "II. Kapitał (fundusz) zapasowy", sub: true, value: z },
      { label: "III. Kapitał (fundusz) z aktualizacji wyceny", sub: true, value: z },
      { label: "IV. Pozostałe kapitały (fundusze) rezerwowe", sub: true, value: z },
      { label: "V. Zysk (strata) z lat ubiegłych", sub: true, value: function (r) { return r.retainedEarningsPriorYears; } },
      { label: "VI. Zysk (strata) netto", sub: true, value: function (r) { return r.retainedEarningsCurrentYear; } },
      { label: "VII. Odpisy z zysku netto w ciągu roku obrotowego", sub: true, value: z },
      { label: "B. Zobowiązania i rezerwy na zobowiązania", major: true, value: function (r) { return r.debtBalance; } },
      { label: "I. Rezerwy na zobowiązania", sub: true, value: z },
      { label: "II. Zobowiązania długoterminowe", sub: true, value: function (r) { return r.debtLongTerm; } },
      { label: "III. Zobowiązania krótkoterminowe", sub: true, value: function (r) { return r.debtShortTerm; } },
      { label: "IV. Rozliczenia międzyokresowe", sub: true, value: z },
      { label: "PASYWA RAZEM", major: true, final: true, value: function (r) { return r.liabEquityTotal; } }
    ];
  }

  /** Shared renderer for the two statutory tables above: line items run down
   *  the rows (matching the letter/roman-numeral order of the actual
   *  statutory form) with each analyzed period as its own column. */
  function renderStatutoryTable(containerId, rowDefs, rows, periodLabelFn, footnote) {
    var container = document.getElementById(containerId);
    if (!container) return;
    var theadCols = rows.map(function (r) { return '<th class="num">' + periodLabelFn(r) + '</th>'; }).join("");
    var tbody = rowDefs.map(function (def) {
      if (def.header) return '<tr class="stat-major"><td colspan="' + (rows.length + 1) + '">' + def.label + '</td></tr>';
      var rowClass = def.reconcile ? "stat-reconcile-head" : (def.final ? "stat-final" : (def.major ? "stat-major" : "stat-sub"));
      var cells = rows.map(function (r) {
        var v = def.value(r);
        return '<td class="num' + (v < -0.5 ? " neg" : "") + '">' + fmt(v, 0) + '</td>';
      }).join("");
      return '<tr class="' + rowClass + '"><td>' + def.label + '</td>' + cells + '</tr>';
    }).join("");
    container.innerHTML = '<div class="table-scroll"><table class="datatable stat-table"><thead><tr><th>Pozycja</th>' + theadCols + '</tr></thead><tbody>' + tbody + '</tbody></table></div>' + (footnote || "");
  }

  /** Portfolio-level RZiS in full statutory form (wariant porównawczy, per
   *  Załącznik nr 1 do ustawy o rachunkowości) — see statutoryPnLRows for
   *  the line-by-line mapping and the note on why company fixed costs sit
   *  below "L." rather than inside "B.". */
  function renderPortfolioPnL(agg, granularity) {
    var rows = granularity === "monthly" ? agg.monthRows.slice(0, 60) : agg.yearRows;
    function periodLabel(r) { return granularity === "monthly" ? (r.year + " " + r.monthName) : String(r.year); }
    var footnote = '<div class="assumption-note">Pełna forma rachunku zysków i strat (wariant porównawczy) zgodnie z Załącznikiem nr 1 do ustawy o rachunkowości — pozycje bez wartości dla tego portfela (np. zapasy, przychody finansowe) wykazano jako 0, zgodnie z układem ustawowym. Pozycja „Koszty stałe spółki” oraz wynikający z niej „Wynik netto portfela razem” nie są częścią jednostkowego RZiS pojedynczego projektu — obrazują one korektę na poziomie portfela/grupy o koszty zarządu nieprzypisane do żadnej farmy, które w tym modelu nie pomniejszają podstawy opodatkowania CIT poszczególnych projektów.' +
      (granularity === "monthly" ? " Pokazano pierwsze 5 lat (60 miesięcy). Pełne dane dostępne są w eksporcie Excel." : "") + '</div>';
    renderStatutoryTable("portfolio-pnl", statutoryPnLRows(), rows, periodLabel, footnote);
  }

  /** Portfolio-level Bilans in full statutory form, per Załącznik nr 1 do
   *  ustawy o rachunkowości — see statutoryBalanceRows. Aktywa razem and
   *  Pasywa razem always tie out exactly (by construction — see the
   *  derivation comment above computePortfolioAggregate's balance trackers),
   *  so this also doubles as a sanity check on the whole cash-flow engine. */
  function renderPortfolioBalance(agg, granularity) {
    var rows = granularity === "monthly" ? agg.monthRows.slice(0, 60) : agg.yearRows;
    function periodLabel(r) { return granularity === "monthly" ? (r.year + " " + r.monthName) : String(r.year); }
    var footnote = '<div class="assumption-note">Pełna forma bilansu zgodnie z Załącznikiem nr 1 do ustawy o rachunkowości — pozycje bez wartości dla tego portfela (np. zapasy, należności, rezerwy) wykazano jako 0. „Zobowiązania długoterminowe”/„krótkoterminowe” dzielą saldo zadłużenia według tego, czy rata kapitałowa jest wymagalna w ciągu kolejnych 12 miesięcy od danego okresu. „AKTYWA RAZEM” i „PASYWA RAZEM” powinny się zgadzać w każdym okresie.' +
      (granularity === "monthly" ? " Pokazano pierwsze 5 lat (60 miesięcy). Pełne dane dostępne są w eksporcie Excel." : "") + '</div>';
    renderStatutoryTable("portfolio-balance", statutoryBalanceRows(), rows, periodLabel, footnote);
  }

  function buildPortfolioChart(agg, granularity) {
    var canvas = document.getElementById("chart-portfolio");
    if (!canvas || typeof Chart === "undefined") return;
    if (chartRefs.portfolio) chartRefs.portfolio.destroy();

    var text = getCSSVar("--text-muted");
    var border = getCSSVar("--border");
    var accent2 = getCSSVar("--accent-2");
    var accent = getCSSVar("--accent");

    var isMonthly = granularity === "monthly";
    var source = isMonthly ? agg.monthRows : agg.yearRows;
    var series = isMonthly ? agg.farmSeriesMonthly : agg.farmSeries;
    var labels = isMonthly
      ? source.map(function (r) { return r.monthName.slice(0, 3) + " " + String(r.year).slice(2); })
      : source.map(function (r) { return String(r.year); });
    var cum = source.map(function (r) { return Math.round(r.cumEquity); });

    var bepIdx = -1;
    if (isMonthly && agg.bep) bepIdx = agg.bep.indexFromStart - 1;
    else if (!isMonthly) bepIdx = source.findIndex(function (r) { return r.isBep; });

    var datasets = series.map(function (fs, idx) {
      return { type: "bar", label: fs.name, data: fs.values.map(function (v) { return Math.round(v); }), backgroundColor: farmColor(idx), stack: "equity", yAxisID: "y" };
    });
    var pointRadii = cum.map(function (v, i) { return i === bepIdx ? 6 : 0; });
    var pointColors = cum.map(function (v, i) { return i === bepIdx ? accent : accent2; });
    datasets.push({
      type: "line", label: "Skumulowany CF (portfel)", data: cum, borderColor: accent2, backgroundColor: accent2,
      tension: 0.25, pointRadius: pointRadii, pointBackgroundColor: pointColors, pointBorderColor: pointColors,
      borderWidth: 2, yAxisID: "y1"
    });

    chartRefs.portfolio = new Chart(canvas.getContext("2d"), {
      data: { labels: labels, datasets: datasets },
      options: {
        responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { labels: { color: text, font: { family: "Poppins" }, boxWidth: 12 } },
          tooltip: {
            callbacks: {
              label: function (ctx) {
                var suffix = (bepIdx >= 0 && ctx.datasetIndex === datasets.length - 1 && ctx.dataIndex === bepIdx) ? "  ← BEP" : "";
                return ctx.dataset.label + ": " + fmt(ctx.parsed.y, 0) + " PLN" + suffix;
              }
            }
          }
        },
        scales: {
          x: { stacked: true, ticks: { color: text, maxRotation: 0, autoSkip: true, maxTicksLimit: isMonthly ? 16 : 12 }, grid: { color: border } },
          y: { stacked: true, ticks: { color: text, callback: function (v) { return fmt(v, 0); } }, grid: { color: border }, title: { display: true, text: isMonthly ? "PLN / miesiąc" : "PLN / rok", color: text } },
          y1: { position: "right", ticks: { color: text, callback: function (v) { return fmt(v, 0); } }, grid: { display: false }, title: { display: true, text: "PLN (skumulowane)", color: text } }
        }
      }
    });
  }

  function exportPortfolioCsv(agg, granularity) {
    if (!chartRefs.downloadsFn) return;
    var split = !!agg.hasAnyStorage;
    var prodHeader = split ? ["Produkcja_PV_MWh", "Produkcja_magazyn_MWh"] : ["Produkcja_MWh"];
    function prodVals(r) {
      return split ? [Math.round(r.productionPv), Math.round(r.productionStorage)] : [Math.round(r.production)];
    }
    var lines, filename;
    if (granularity === "monthly") {
      var header1 = ["Rok", "Miesiac"].concat(prodHeader, ["Przychod_PLN", "OPEX_PLN", "EBITDA_PLN", "Rata_dluzna_PLN", "CF_equity_farmy_PLN", "Koszty_stale_spolki_PLN", "CF_equity_po_kosztach_stalych_PLN", "CF_equity_skumulowany_bez_wkladu_PLN", "CF_equity_skumulowany_PLN", "Wklad_wlasny_PLN", "BEP"]);
      lines = [header1.join(";")];
      agg.monthRows.forEach(function (r, idx) {
        var isBep = agg.bep && (idx + 1) === agg.bep.indexFromStart ? "TAK" : "";
        lines.push([r.year, r.monthName].concat(prodVals(r), [Math.round(r.revenue), Math.round(r.opex), Math.round(r.ebitda),
        Math.round(r.debtPayment), Math.round(r.equityFCFOperating), Math.round(r.fixedCost), Math.round(r.equityFCFNetOperating), Math.round(r.cumEquityNetOperating), Math.round(r.cumEquity), Math.round(r.equityOut), isBep]).join(";"));
      });
      filename = "portfel_" + agg.count + "_farm_przeplywy_miesieczne.csv";
    } else {
      var header2 = ["Rok"].concat(prodHeader, ["Przychod_PLN", "OPEX_PLN", "EBITDA_PLN", "Rata_dluzna_PLN", "CF_equity_farmy_PLN", "Koszty_stale_spolki_PLN", "CF_equity_po_kosztach_stalych_PLN", "CF_equity_skumulowany_bez_wkladu_PLN", "CF_equity_skumulowany_PLN", "Wklad_wlasny_PLN", "DSCR", "BEP"]);
      lines = [header2.join(";")];
      agg.yearRows.forEach(function (r) {
        lines.push([r.year].concat(prodVals(r), [Math.round(r.revenue), Math.round(r.opex), Math.round(r.ebitda),
        Math.round(r.debtPayment), Math.round(r.equityFCFOperating), Math.round(r.fixedCost), Math.round(r.equityFCFNetOperating), Math.round(r.cumEquityNetOperating), Math.round(r.cumEquity), Math.round(r.equityOut), r.dscr !== null ? r.dscr.toFixed(2) : "", r.isBep ? "TAK" : ""]).join(";"));
      });
      filename = "portfel_" + agg.count + "_farm_przeplywy_roczne.csv";
    }
    var csv = "﻿" + lines.join("\r\n");
    chartRefs.downloadsFn({ filename: filename, data: csv }).catch(function () {});
  }

  /** Full financial-data export as a multi-sheet Excel workbook: cash flows,
   *  P&L and balance sheet, each at both monthly and annual granularity (the
   *  file always carries the full horizon, unlike the on-screen tables which
   *  cap the monthly view to 5 years) — this is "the file with the financial
   *  data" the user can take into Excel, independent of whatever granularity
   *  toggle happens to be selected on screen when they click export. */
  function exportPortfolioXlsx(agg, granularity) {
    if (!chartRefs.downloadsFn) return;
    var btn = document.getElementById("btn-export-portfolio-xlsx");
    var btnOriginalText = btn ? btn.textContent : null;
    whenExcelReady(function () {
      try {
        var split = !!agg.hasAnyStorage;
        function prodHeader() { return split ? ["Produkcja PV (MWh)", "Produkcja magazyn (MWh)"] : ["Produkcja (MWh)"]; }
        function prodVals(r) { return split ? [Math.round(r.productionPv), Math.round(r.productionStorage)] : [Math.round(r.production)]; }

        function cfAoa(rows, isMonthly) {
          var header = (isMonthly ? ["Rok", "Miesiąc"] : ["Rok"]).concat(prodHeader(),
            ["Przychód (PLN)", "OPEX (PLN)", "EBITDA (PLN)", "Rata długu (PLN)", "CF equity - farmy (PLN)",
              "Koszty stałe spółki (PLN)", "CF equity netto (PLN)", "CF equity netto skumulowane bez wkładu własnego (PLN)", "CF equity skumulowany (PLN)", "Wkład własny (PLN)"],
            isMonthly ? [] : ["DSCR"], ["BEP"]);
          var aoa = [header];
          rows.forEach(function (r, idx) {
            var isBep = isMonthly ? !!(agg.bep && (idx + 1) === agg.bep.indexFromStart) : !!r.isBep;
            var lead = isMonthly ? [r.year, r.monthName] : [r.year];
            aoa.push(lead.concat(prodVals(r),
              [Math.round(r.revenue), Math.round(r.opex), Math.round(r.ebitda), Math.round(r.debtPayment), Math.round(r.equityFCFOperating),
                Math.round(r.fixedCost), Math.round(r.equityFCFNetOperating), Math.round(r.cumEquityNetOperating), Math.round(r.cumEquity), Math.round(r.equityOut)],
              isMonthly ? [] : [r.dscr !== null ? +r.dscr.toFixed(2) : null], [isBep ? "TAK" : ""]));
          });
          return aoa;
        }

        var portfolioLabel = "Portfel (" + agg.count + " farm)";
        var wb = new ExcelJS.Workbook();
        wb.creator = "Budżet Farm PV";
        xlsAddFlatSheet(wb, "CF miesieczne", portfolioLabel + " — Cash Flow (miesięcznie)", cfAoa(agg.monthRows, true));
        xlsAddFlatSheet(wb, "CF roczne", portfolioLabel + " — Cash Flow (rocznie)", cfAoa(agg.yearRows, false));
        xlsAddStatutorySheet(wb, "PiS miesieczne", portfolioLabel + " — RZiS (miesięcznie)", statutoryPnLRows(), agg.monthRows, true);
        xlsAddStatutorySheet(wb, "PiS roczne", portfolioLabel + " — RZiS (rocznie)", statutoryPnLRows(), agg.yearRows, false);
        xlsAddStatutorySheet(wb, "Bilans miesieczny", portfolioLabel + " — Bilans (miesięcznie)", statutoryBalanceRows(), agg.monthRows, true);
        xlsAddStatutorySheet(wb, "Bilans roczny", portfolioLabel + " — Bilans (rocznie)", statutoryBalanceRows(), agg.yearRows, false);

        var filename = "portfel_" + agg.count + "_farm_dane_finansowe.xlsx";
        xlsDownloadWorkbook(wb, filename).catch(function () {
          if (btn) { btn.textContent = "Błąd eksportu — spróbuj CSV"; setTimeout(function () { if (btn) btn.textContent = btnOriginalText; }, 4000); }
        });
      } catch (eXlsx) {
        if (btn) { btn.textContent = "Błąd eksportu — spróbuj CSV"; setTimeout(function () { if (btn) btn.textContent = btnOriginalText; }, 4000); }
      }
    }, function () {
      if (btn) { btn.textContent = "Excel niedostępny — spróbuj CSV"; setTimeout(function () { if (btn) btn.textContent = btnOriginalText; }, 4000); }
    });
  }

  /* ============================================================
     RENDER: EMPTY STATE
     ============================================================ */
  function renderEmptyState() {
    var main = document.getElementById("main");
    main.innerHTML =
      '<div class="empty-state"><div class="brand-mark" style="margin:0 auto 18px;">' +
      '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v3"/><path d="M12 18.5v3"/><path d="M4.6 4.6l2.1 2.1"/><path d="M17.3 17.3l2.1 2.1"/><path d="M2.5 12h3"/><path d="M18.5 12h3"/><path d="M4.6 19.4l2.1-2.1"/><path d="M17.3 6.7l2.1-2.1"/></g></svg></div>' +
      '<h2>Zbuduj swój pierwszy budżet farmy PV</h2>' +
      '<p>Wprowadź CAPEX, OPEX, założenia produkcji, finansowania i — opcjonalnie — magazynu energii, aby obliczyć NPV, IRR i LCOE, a następnie porównuj projekty w portfelu.</p>' +
      '<button class="btn btn-primary" id="btn-empty-new">+ Nowy projekt</button></div>';
    document.getElementById("btn-empty-new").addEventListener("click", function () { createProject(); });
  }

  /* ============================================================
     MASTER RENDER
     ============================================================ */
  function renderAll() {
    renderSidebar();
    if (state.projects.length === 0 && state.loaded) { renderEmptyState(); return; }
    if (state.view === "compare") { renderCompare(); return; }
    if (state.selectedId && state.draft) {
      if (formRenderedFor !== state.selectedId) renderEditorForm();
      var resultsTab = document.getElementById("tab-results");
      if (resultsTab && !resultsTab.hidden) renderResults();
    } else if (state.projects.length > 0) {
      selectProject(state.projects[0].id);
    }
  }

  /* ============================================================
     INIT
     ============================================================ */
  document.getElementById("btn-new-project").addEventListener("click", function () { createProject(); });
  document.getElementById("btn-compare").addEventListener("click", function () { state.view = "compare"; renderAll(); });

  function setIoNote(msg) {
    var el = document.getElementById("io-note");
    if (el) el.textContent = msg;
  }

  /** Full-portfolio export: every project plus the portfolio-level selection/
   *  quantities/fixed-costs, as one JSON file — this is the "send everything
   *  to someone else by e-mail" path (see importAllDataFromFile), independent
   *  of whichever storage layer (Claude db, or local-browser fallback) is
   *  actually holding the data right now. Uses the same downloadsFn as the
   *  CSV/Excel exports, so it works identically with or without a Claude
   *  account. */
  function exportAllData() {
    var payload = {
      app: "pv-budget", exportVersion: 1, exportedAt: new Date().toISOString(),
      projects: (state.projects || []).map(function (p) { return deepClone(p); }),
      selection: { ids: state.selectedIds, quantities: state.quantities || {} },
      fixedCosts: state.fixedCosts || null
    };
    var json = JSON.stringify(payload, null, 2);
    var filename = "pv-budget-dane_" + new Date().toISOString().slice(0, 10) + ".json";
    var fn = chartRefs.downloadsFn || browserDownloadFallback;
    fn({ filename: filename, data: json }).then(function () {
      setIoNote("Zapisano " + payload.projects.length + " projekt(ów) do pliku.");
    }).catch(function () { setIoNote("Błąd zapisu pliku — spróbuj ponownie."); });
  }

  /** Import counterpart to exportAllData: reads a previously-exported JSON
   *  file and ADDS its projects into the current portfolio as brand-new
   *  entries (fresh ids, via dataLayer.add — never overwriting anything
   *  already here), so importing is always non-destructive. Each project is
   *  run back through migrateProject, so files exported from older app
   *  versions still load correctly. Portfolio-level fixed costs are imported
   *  too (they are a single shared setting, not tied to any id, so importing
   *  them just replaces the current value); the selection is only touched if
   *  it was already a specific subset (not "all"), in which case the newly
   *  imported projects are added to it so they show up in the comparison
   *  view instead of being silently excluded. */
  function importAllDataFromFile(file) {
    if (!file) return;
    if (!dataLayer) { setIoNote("Aplikacja jeszcze się ładuje — spróbuj za chwilę."); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try { parsed = JSON.parse(String(reader.result)); } catch (e) { setIoNote("Nieprawidłowy plik — to nie jest poprawny plik danych (JSON)."); return; }
      if (!parsed || !Array.isArray(parsed.projects)) { setIoNote("Nieprawidłowy plik — brak listy projektów."); return; }
      var toImport = parsed.projects.map(function (raw) {
        var clone = deepClone(raw);
        delete clone.id; delete clone.createdAt; delete clone.updatedAt;
        return migrateProject(clone);
      });
      if (!toImport.length) { setIoNote("Plik nie zawiera żadnych projektów do zaimportowania."); return; }
      setIoNote("Importowanie " + toImport.length + " projekt(ów)…");
      var newIds = [];
      var chain = Promise.resolve();
      toImport.forEach(function (data) {
        chain = chain.then(function () {
          var d = deepClone(data);
          delete d.id;
          d.createdAt = new Date().toISOString(); d.updatedAt = d.createdAt;
          return dataLayer.add(d).then(function (id) { newIds.push(id); });
        });
      });
      chain.then(function () {
        if (state.selectedIds !== null) setSelectedIds(state.selectedIds.concat(newIds));
        if (parsed.fixedCosts && fixedCostsLayer) { state.fixedCosts = parsed.fixedCosts; fixedCostsLayer.setFixedCosts(parsed.fixedCosts); }
        setIoNote("Zaimportowano " + newIds.length + " projekt(ów).");
      }).catch(function () { setIoNote("Błąd podczas importu — spróbuj ponownie."); });
    };
    reader.onerror = function () { setIoNote("Nie udało się odczytać pliku."); };
    reader.readAsText(file);
  }

  document.getElementById("btn-export-all").addEventListener("click", exportAllData);
  document.getElementById("btn-import-all").addEventListener("click", function () {
    document.getElementById("import-file-input").click();
  });
  document.getElementById("import-file-input").addEventListener("change", function (ev) {
    var file = ev.target.files && ev.target.files[0];
    importAllDataFromFile(file);
    ev.target.value = "";
  });

  if (window.matchMedia) {
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
      if (state.view === "compare") renderCompare();
      else if (state.selectedId) { var rt = document.getElementById("tab-results"); if (rt && !rt.hidden) renderResults(); }
    });
  }

  /** Plain-browser download, used whenever the Claude "downloads" capability
   *  is not available — most importantly when this file is opened standalone
   *  (no Claude account / no claude.ai runtime at all), where window.claude
   *  does not exist. Works in any modern browser with zero permissions or
   *  login: builds a Blob (text data is wrapped as UTF-8 CSV; Blob data, e.g.
   *  from xlsDownloadWorkbook, is used as-is), then triggers a normal
   *  browser download via a temporary anchor element. */
  function browserDownloadFallback(req) {
    try {
      var data = req.data;
      var blob = (typeof Blob !== "undefined" && data instanceof Blob) ? data : new Blob([data], { type: "text/csv;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = req.filename || "export";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      return Promise.resolve();
    } catch (e) { return Promise.reject(e); }
  }

  function boot() {
    var claude = window.claude;
    var dbPromise = claude && claude.use ? claude.use("db") : Promise.resolve(null);
    var downloadsPromise = claude && claude.use ? claude.use("downloads") : Promise.resolve(null);

    Promise.all([dbPromise, downloadsPromise]).then(function (res) {
      var db = res[0], downloads = res[1];
      // Exports always work: prefer the Claude "downloads" capability when
      // present, otherwise fall back to a plain browser download so CSV/Excel
      // export never depends on being signed in to a Claude account.
      chartRefs.downloadsAvailable = true;
      chartRefs.downloadsFn = downloads ? function (req) { return downloads.save(req); } : browserDownloadFallback;

      if (db) {
        dataLayer = makeDbLayer(db);
        selectionLayer = makeSelectionDbLayer(db);
        fixedCostsLayer = makeFixedCostsDbLayer(db);
        document.getElementById("sync-note").textContent = "Dane zapisywane automatycznie i widoczne dla organizacji.";
      } else {
        // No example/sample projects seeded — a fresh browser profile (or a
        // fresh copy of the standalone file) starts with an empty project
        // list (renderEmptyState), not pre-filled demo farms.
        dataLayer = makeMemoryLayer([]);
        selectionLayer = makeSelectionMemoryLayer();
        fixedCostsLayer = makeFixedCostsMemoryLayer();
        document.getElementById("sync-note").textContent = "Tryb offline — dane zapisywane lokalnie w tej przeglądarce (nie wymaga konta).";
      }

      dataLayer.subscribe(function (list) {
        state.projects = list.map(migrateProject).map(function (proj, i) { proj.id = list[i].id; return proj; });
        state.loaded = true;
        if (state.selectedId && !findProject(state.selectedId)) { state.selectedId = null; state.draft = null; formRenderedFor = null; }
        renderAll();
      });
      selectionLayer.subscribe(function (sel) { state.selectedIds = sel.ids; state.quantities = sel.quantities || {}; if (state.view === "compare") renderCompare(); });
      fixedCostsLayer.subscribe(function (fc) { state.fixedCosts = fc; if (state.view === "compare") renderCompare(); });
    }).catch(function () {
      chartRefs.downloadsAvailable = true;
      chartRefs.downloadsFn = browserDownloadFallback;
      // No example/sample project seeded here either — see the comment above.
      dataLayer = makeMemoryLayer([]);
      selectionLayer = makeSelectionMemoryLayer();
      fixedCostsLayer = makeFixedCostsMemoryLayer();
      dataLayer.subscribe(function (list) { state.projects = list.map(migrateProject).map(function (proj, i) { proj.id = list[i].id; return proj; }); state.loaded = true; renderAll(); });
      selectionLayer.subscribe(function (sel) { state.selectedIds = sel.ids; state.quantities = sel.quantities || {}; if (state.view === "compare") renderCompare(); });
      fixedCostsLayer.subscribe(function (fc) { state.fixedCosts = fc; if (state.view === "compare") renderCompare(); });
      var sn = document.getElementById("sync-note");
      if (sn) sn.textContent = "Tryb offline — dane zapisywane lokalnie w tej przeglądarce (nie wymaga konta).";
    });
  }

  boot();
})();
</script>
