<title>Budżet Farm PV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4ef;
    --surface: #ffffff;
    --surface-2: #eaece2;
    --surface-3: #dfe2d5;
    --text: #1b211d;
    --text-muted: #5c665f;
    --text-faint: #8b9389;
    --border: #d7dbcd;
    --accent: #1e3641;
    --accent-ink: #f7fbf9;
    --accent-soft: #e4eaec;
    --accent-2: #1f8c5e;
    --accent-2-soft: #e1f3ea;
    --positive: #2f7d4f;
    --positive-bg: #e2f0e5;
    --negative: #b23b3b;
    --negative-bg: #f6e4e1;
    --focus: #1f8c5e;
    --shadow: 0 1px 2px rgba(27,33,29,0.06), 0 4px 14px rgba(27,33,29,0.05);
    --radius-s: 8px;
    --radius-m: 12px;
    --radius-l: 18px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121815;
      --surface: #1a211d;
      --surface-2: #212a24;
      --surface-3: #2a352d;
      --text: #edf1ea;
      --text-muted: #9daa9f;
      --text-faint: #6f7b71;
      --border: #2c3a32;
      --accent: #3e6c82;
      --accent-ink: #eef6f9;
      --accent-soft: #24333b;
      --accent-2: #6fd9a4;
      --accent-2-soft: #1c3530;
      --positive: #4caf72;
      --positive-bg: #1d3324;
      --negative: #e2685f;
      --negative-bg: #3a2220;
      --focus: #6fd9a4;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
    }
  }

  :root[data-theme="dark"] {
    --bg: #121815;
    --surface: #1a211d;
    --surface-2: #212a24;
    --surface-3: #2a352d;
    --text: #edf1ea;
    --text-muted: #9daa9f;
    --text-faint: #6f7b71;
    --border: #2c3a32;
    --accent: #3e6c82;
    --accent-ink: #eef6f9;
    --accent-soft: #24333b;
    --accent-2: #6fd9a4;
    --accent-2-soft: #1c3530;
    --positive: #4caf72;
    --positive-bg: #1d3324;
    --negative: #e2685f;
    --negative-bg: #3a2220;
    --focus: #6fd9a4;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }
  h1, h2, h3, h4 { font-family: "Poppins", sans-serif; text-wrap: balance; margin: 0; }
  .num, input[type="number"], input[data-numfield], table.datatable td, .kpi-value, .money {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }
  button, select { font-family: inherit; }
  a { color: var(--accent); }

  #app { display: flex; min-height: 100%; align-items: stretch; }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: 300px; flex: 0 0 300px;
    background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 18px 14px; gap: 14px;
    height: 100vh; height: 100dvh; position: sticky; top: 0; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 4px 6px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(155deg, var(--accent), #0f2129);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent-ink); flex: 0 0 auto;
  }
  .brand-logo-mark { flex: 0 0 auto; display: flex; align-items: center; }
  .brand-logo { height: 30px; width: auto; display: block; }
  .brand-logo-for-dark { display: none; }
  :root[data-theme="dark"] .brand-logo-for-light { display: none; }
  :root[data-theme="dark"] .brand-logo-for-dark { display: block; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .brand-logo-for-light { display: none; }
    :root:not([data-theme="light"]) .brand-logo-for-dark { display: block; }
  }
  .brand-text h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .brand-text p { margin: 1px 0 0; font-size: 11.5px; color: var(--text-muted); }

  .btn {
    appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 500; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .12s ease, border-color .12s ease, transform .05s ease;
  }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { filter: brightness(1.06); background: var(--accent); }
  .btn-block { width: 100%; }
  .btn-sm { padding: 5px 9px; font-size: 12px; }
  .btn-danger-arm { border-color: var(--negative); color: var(--negative); }

  #project-list { display: flex; flex-direction: column; gap: 6px; flex: 1 1 auto; overflow-y: auto; }
  .project-item {
    text-align: left; border: 1px solid transparent; border-radius: var(--radius-m);
    padding: 10px 11px; cursor: pointer; background: transparent;
    display: flex; flex-direction: column; gap: 4px;
  }
  .project-item:hover { background: var(--surface-2); }
  .project-item.active { background: var(--accent-soft); border-color: var(--accent); }
  .project-item-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .project-item-name { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project-item-meta { font-size: 11.5px; color: var(--text-muted); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .project-item-meta-left { display: flex; align-items: center; gap: 6px; overflow: hidden; }
  .badge {
    display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 8px;
    font-size: 11px; font-weight: 600; font-family: "IBM Plex Mono", monospace; white-space: nowrap;
  }
  .badge-pos { background: var(--positive-bg); color: var(--positive); }
  .badge-neg { background: var(--negative-bg); color: var(--negative); }
  .badge-neutral { background: var(--surface-3); color: var(--text-muted); }
  .badge-accent2 { background: var(--accent-2-soft); color: var(--accent-2); }

  .sidebar-foot { display: flex; flex-direction: column; gap: 8px; padding-top: 6px; border-top: 1px solid var(--border); }
  .data-io-row { display: flex; gap: 6px; }
  .data-io-row .btn { flex: 1 1 0; }
  .sidebar-note { font-size: 11px; color: var(--text-faint); padding: 0 2px; }

  /* ---------- Main ---------- */
  #main { flex: 1 1 auto; min-width: 0; padding: 26px 34px 60px; max-width: 1180px; }
  .view-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .view-header h2 { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
  .view-header .subtitle { color: var(--text-muted); font-size: 13px; margin-top: 3px; }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 22px; }
  .tab-btn {
    appearance: none; background: transparent; border: none; border-bottom: 2px solid transparent;
    padding: 9px 4px; margin-right: 20px; font-size: 13.5px; font-weight: 600; color: var(--text-muted); cursor: pointer;
  }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab-btn:hover { color: var(--text); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-l); padding: 18px 20px; box-shadow: var(--shadow); }
  .section { margin-bottom: 20px; }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }
  .section-head h3 { font-size: 14.5px; font-weight: 700; }
  .section-head .hint { font-size: 11.5px; color: var(--text-faint); font-weight: 400; }
  .section-sum { font-size: 12.5px; color: var(--text-muted); }
  .section-sum b { color: var(--text); font-family: "IBM Plex Mono", monospace; }

  .field-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 16px; }
  .field-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--text-muted); }
  .field .input-wrap { position: relative; display: flex; align-items: center; }
  .field input[type="number"], .field input[type="text"], .field select {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-s);
    padding: 8px 10px; font-size: 13.5px; color: var(--text);
  }
  .field input[type="number"], .field input[data-numfield] { padding-right: 44px; }
  .field .unit { position: absolute; right: 10px; font-size: 11px; color: var(--text-faint); pointer-events: none; }
  .field input:focus-visible, .field input:focus, .field select:focus-visible { outline: 2px solid var(--focus); outline-offset: -1px; border-color: var(--focus); }
  .field-check { flex-direction: row; align-items: center; gap: 8px; }
  .field-check input { width: 16px; height: 16px; }

  .toggle-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .toggle-card label { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .toggle-card label input { width: 18px; height: 18px; }
  .toggle-card p { margin: 2px 0 0 28px; font-size: 12px; color: var(--text-muted); }

  .title-row { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 4px; }
  .title-row .field { flex: 1 1 220px; }
  .title-row .field.small { flex: 0 0 140px; }

  .month-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px 12px; }
  .month-grid .field label { font-size: 11px; }
  .month-grid .field input { padding-right: 26px; }
  .month-grid .unit { font-size: 10px; }

  .segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; background: var(--surface); }
  .segmented button { border: none; background: transparent; padding: 6px 14px; font-size: 12.5px; font-weight: 600; color: var(--text-muted); cursor: pointer; }
  .segmented button.active { background: var(--accent-soft); color: var(--text); }
  .segmented button:hover:not(.active) { background: var(--surface-2); }

  /* KPI tiles */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
  .kpi-tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-m); padding: 13px 15px; }
  .kpi-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
  .kpi-value { font-size: 19px; font-weight: 600; margin-top: 4px; }
  .kpi-value.pos { color: var(--positive); }
  .kpi-value.neg { color: var(--negative); }
  .kpi-sub { font-size: 11px; color: var(--text-faint); margin-top: 2px; }

  .chart-card { margin-bottom: 22px; }
  .chart-wrap { position: relative; height: 280px; }
  .chart-wrap.short { height: 220px; }

  .toolbar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar-row .toolbar-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .select-count { font-size: 12.5px; color: var(--text-muted); }
  .empty-summary { padding: 26px 4px; color: var(--text-muted); font-size: 13px; text-align: center; }
  .bep-banner {
    display: flex; align-items: center; gap: 10px; background: var(--accent-2-soft); color: var(--text);
    border: 1px solid var(--accent-2); border-radius: var(--radius-m); padding: 11px 14px; font-size: 13px;
  }
  .bep-banner svg { flex: 0 0 auto; color: var(--accent-2); }
  .bep-banner strong { font-family: "IBM Plex Mono", monospace; }
  .bep-banner-muted { background: var(--surface-2); border-color: var(--border); color: var(--text-muted); }
  tr.bep-row td { background: var(--accent-2-soft); }
  tr.bep-row td:first-child { font-weight: 700; }
  .bep-flag {
    display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
    background: var(--accent-2); color: var(--surface); border-radius: 3px; padding: 1px 5px; margin-left: 6px; vertical-align: middle;
  }

  .table-scroll { overflow-x: auto; overflow-y: auto; max-height: 560px; border: 1px solid var(--border); border-radius: var(--radius-m); }
  table.datatable { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 12.5px; }
  table.datatable th, table.datatable td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); }
  table.datatable th:first-child, table.datatable td:first-child { text-align: left; }
  table.datatable thead th { background: var(--surface-2); font-weight: 600; color: var(--text-muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; position: sticky; top: 0; }
  table.datatable tbody tr:last-child td { border-bottom: none; }
  table.datatable tbody tr:hover { background: var(--surface-2); }
  table.datatable td.neg { color: var(--negative); }
  table.datatable th.sortable { cursor: pointer; }
  table.datatable th.sortable:hover { color: var(--text); }
  table.datatable td.select-cell, table.datatable th.select-cell { width: 34px; text-align: center; white-space: nowrap; }
  table.datatable input[type="checkbox"].row-check { width: 16px; height: 16px; cursor: pointer; }
  table.datatable tr.row-selected td { background: var(--accent-soft); }
  table.datatable tr.row-selected:hover td { background: var(--accent-soft); filter: brightness(0.97); }

  /* Statutory RZiS / Bilans tables (Załącznik 1 do ustawy o rachunkowości):
     line items run down the rows — matching the letter/roman-numeral
     structure of the actual statutory form — with each analyzed period as
     its own column, so the first column needs more room and no wrapping. */
  table.datatable.stat-table td:first-child, table.datatable.stat-table th:first-child { min-width: 340px; white-space: normal; }
  table.datatable.stat-table tr.stat-sub td:first-child { padding-left: 28px; color: var(--text-muted); font-weight: 400; }
  table.datatable.stat-table tr.stat-major td { font-weight: 700; }
  table.datatable.stat-table tr.stat-major td { border-top: 2px solid var(--border); }
  table.datatable.stat-table tr.stat-final td { font-weight: 700; border-top: 2px solid var(--text); }
  table.datatable.stat-table tr.stat-reconcile-head td:first-child { padding-top: 16px; border-top: 1px dashed var(--border); font-style: italic; color: var(--text-faint); font-weight: 400; }
  table.datatable.stat-table tr.stat-reconcile-head td:not(:first-child) { padding-top: 16px; border-top: 1px dashed var(--border); }

  .stats-band {
    display: flex; flex-wrap: wrap; background: var(--accent); color: var(--accent-ink);
    border-radius: var(--radius-l); margin-bottom: 18px; overflow: hidden;
  }
  .stats-band-item { flex: 1 1 150px; text-align: center; padding: 20px 12px; border-right: 1px solid rgba(255,255,255,0.14); }
  .stats-band-item:last-child { border-right: none; }
  .stats-band-value { font-size: 27px; font-weight: 700; font-family: "IBM Plex Mono", monospace; letter-spacing: -0.01em; }
  .stats-band-label { margin-top: 4px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.88; }

  .empty-state { text-align: center; padding: 70px 20px; max-width: 420px; margin: 40px auto; }
  .empty-state .brand-mark { margin: 0 auto 18px; width: 52px; height: 52px; border-radius: 16px; }
  .empty-state h2 { font-size: 19px; margin-bottom: 8px; }
  .empty-state p { color: var(--text-muted); font-size: 13.5px; margin-bottom: 20px; }

  .assumption-note { font-size: 11.5px; color: var(--text-faint); margin-top: 6px; }

  .capex-items-list { display: flex; flex-direction: column; }
  .capex-item-row { display: grid; grid-template-columns: 2fr 1fr auto; gap: 10px 14px; align-items: end; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .capex-item-row:last-child { border-bottom: none; padding-bottom: 0; }
  .capex-item-row:first-child { padding-top: 0; }
  .capex-item-row .field { margin: 0; }
  .dep-rate-hint { font-size: 11.5px; color: var(--text-muted); font-family: "IBM Plex Mono", monospace; white-space: nowrap; padding-bottom: 9px; }
  .dep-note { font-size: 11.5px; color: var(--text-faint); align-self: center; grid-column: 2 / span 2; padding-bottom: 4px; }
  .one-time-readout-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0 4px; margin-top: 4px; border-top: 1px solid var(--border); }
  .one-time-readout-label { font-size: 13px; color: var(--text-muted); }
  .one-time-readout-value { font-size: 14px; font-weight: 600; }

  @media (max-width: 860px) {
    #app { flex-direction: column; }
    #sidebar { width: 100%; flex: 0 0 auto; height: auto; position: relative; border-right: none; border-bottom: 1px solid var(--border); }
    #project-list { max-height: 220px; }
    #main { padding: 20px 16px 50px; }
    .field-grid { grid-template-columns: repeat(2, 1fr); }
    .month-grid { grid-template-columns: repeat(4, 1fr); }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 480px) {
    .field-grid { grid-template-columns: 1fr; }
    .month-grid { grid-template-columns: repeat(3, 1fr); }
    .kpi-grid { grid-template-columns: 1fr 1fr; }
    .capex-item-row { grid-template-columns: 1fr; }
    .dep-note { grid-column: 1; }
  }

  [hidden] { display: none !important; }
</style>

<div id="app">
  <aside id="sidebar">

<script>
(function () {
  "use strict";

  /* ============================================================
     UTILITIES
     ============================================================ */
  /** Groups an all-digit string with a plain space every 3 digits from the
   *  right, e.g. "1234567" -> "1 234 567" — a literal space (not a
   *  locale-dependent non-breaking space some browsers use for
   *  toLocaleString), so every number in the app — read-only figures and
   *  editable fields alike — uses exactly the same separator character.
   *  Shared by fmt/fmtPct/fmtYears (read-only display) and
   *  formatNumericInputValue (live-typed editable fields). */
  function groupThousands(intDigits) {
    return intDigits.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  }
  /** Formats a finite number for read-only display with space-separated
   *  thousands and a comma decimal separator (Polish convention), e.g.
   *  1234567.5 -> "1 234 567,5". */
  function fmt(n, decimals) {
    if (n === null || n === undefined || !isFinite(n)) return "–";
    decimals = decimals === undefined ? 0 : decimals;
    var neg = n < 0;
    var fixed = Math.abs(n).toFixed(decimals);
    var dotIdx = fixed.indexOf(".");
    var intPart = dotIdx === -1 ? fixed : fixed.slice(0, dotIdx);
    var fracPart = dotIdx === -1 ? "" : fixed.slice(dotIdx + 1);
    return (neg ? "-" : "") + groupThousands(intPart) + (fracPart ? "," + fracPart : "");
  }
  function fmtPct(x, decimals) {
    if (x === null || x === undefined || !isFinite(x)) return "–";
    decimals = decimals === undefined ? 1 : decimals;
    return fmt(x * 100, decimals) + "%";
  }
  function fmtYears(x, decimals) {
    if (x === null || x === undefined || !isFinite(x)) return "–";
    decimals = decimals === undefined ? 1 : decimals;
    return fmt(x, decimals) + " lat";
  }
  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
  function num(v, fallback) { var n = parseFloat(v); return isFinite(n) ? n : (fallback === undefined ? 0 : fallback); }
  /** Formats a user-typed numeric string for display in an editable field
   *  with space-separated thousands (e.g. "300000" -> "300 000",
   *  "1050000.5" -> "1 050 000.5") — the editable-field counterpart to fmt().
   *  Tolerant of in-progress/partial input (a lone "-", a trailing ".",
   *  leading zeros, stray spaces already in the string) so it can be
   *  re-applied after every keystroke without fighting the user's typing.
   *  Keeps "." as the decimal separator (not "," as in the read-only fmt())
   *  to match this app's existing internal number parsing (num/parseFloat)
   *  and the step="0.1"-style conventions already used throughout the form. */
  function formatNumericInputValue(raw) {

   *  with the same defaults a fresh project gets (see defaultProject)
   *  rather than leaving them undefined/blank, so opening an existing farm
   *  shows the same starting values a new one would, while adding nothing
   *  to that farm's CAPEX, OPEX, or revenue until the user actually edits
   *  them. */
  function migrateMiscRevenueAndCosts(p) {
    if (p.pv.opex.inne_pozostale_pln_rok === undefined) p.pv.opex.inne_pozostale_pln_rok = 0;
    if (p.storage && p.storage.opex && p.storage.opex.inne_pozostale_pln_rok === undefined) p.storage.opex.inne_pozostale_pln_rok = 0;
    if (p.pv.revenue.price_go_pln_mwh === undefined) p.pv.revenue.price_go_pln_mwh = 2.5;
    if (p.pv.revenue.price_go_escalation_pct === undefined) p.pv.revenue.price_go_escalation_pct = 0;
    if (p.pv.revenue.inne_przychody_pln_rok === undefined) p.pv.revenue.inne_przychody_pln_rok = 0;
    if (p.pv.capex.inne_jednorazowe === undefined) p.pv.capex.inne_jednorazowe = 0;
    if (!p.pv.capex_depreciation_years) p.pv.capex_depreciation_years = {};
    if (p.pv.capex_depreciation_years.inne_jednorazowe === undefined) p.pv.capex_depreciation_years.inne_jednorazowe = 10;
    if (p.pv.capex_amortize_inne_jednorazowe === undefined) p.pv.capex_amortize_inne_jednorazowe = true;
    return p;
  }

  /* ============================================================
     DATA LAYER (db capability with in-memory fallback)
     ============================================================ */
  var dataLayer = null;

  /** When this file is opened standalone (double-clicked, emailed, opened on
   *  a computer with no Claude account) window.claude does not exist, so the
   *  app runs entirely on the in-memory fallback layers below. To keep a
   *  person's data across reloads in that mode — without ever requiring any
   *  account — these helpers persist to the browser's own localStorage,
   *  scoped to whichever machine/browser opened the file. This is best-effort
   *  only: private windows, restricted storage or old browsers can make
   *  localStorage throw or silently no-op, so every call is wrapped and a
   *  failure just falls back to pure in-memory (session-only) behavior. */
  function safeLsGet(key) {
    try {
      var raw = window.localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function safeLsSet(key, value) {
    try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore: storage unavailable */ }
  }

  function makeMemoryLayer(seedList) {
    var LS_KEY = "pv_budget_projects_v1";
    var persisted = safeLsGet(LS_KEY);
    var items = (Array.isArray(persisted) && persisted.length)
      ? persisted
      : seedList.map(function (it) { return Object.assign({ id: uid() }, it); });
    var listeners = [];
    function notify() { listeners.forEach(function (cb) { cb(items.slice()); }); safeLsSet(LS_KEY, items); }
    return {
      subscribe: function (cb) { listeners.push(cb); cb(items.slice()); return function () { listeners = listeners.filter(function (l) { return l !== cb; }); }; },
      add: function (data) { var doc = Object.assign({ id: uid() }, data); items.push(doc); notify(); return Promise.resolve(doc.id); },
      update: function (id, data) {
        var idx = items.findIndex(function (i) { return i.id === id; });
        if (idx >= 0) { items[idx] = Object.assign({}, items[idx], data, { id: id }); notify(); }
        return Promise.resolve();
      },
      remove: function (id) { items = items.filter(function (i) { return i.id !== id; }); notify(); return Promise.resolve(); }
    };
  }
  function makeDbLayer(db) {
    var col = db.collection("projects");
    return {
      subscribe: function (cb, onErr) {
        return col.onSnapshot(function (snap) {
          cb(snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }));
        }, onErr);
      },
      add: function (data) { return col.add(data).then(function (ref) { return ref.id; }); },
      update: function (id, data) { return col.doc(id).update(data).catch(function () { return col.doc(id).set(data); }); },
      remove: function (id) { return col.doc(id).delete(); }

  }
  /** The selection doc also carries per-project "quantities" (how many times
   *  an identical farm should be counted in the portfolio aggregate — see
   *  getQuantity/setQuantity) so a user doesn't have to duplicate a project
   *  just to model building the same farm twice. Both travel together since
   *  a quantity is meaningless without the project being selected, and this
   *  keeps everyone viewing the portfolio in sync via a single small doc. */
  function makeSelectionDbLayer(db) {
    var ref = db.doc("portfolio/selection");
    return {
      subscribe: function (cb, onErr) {
        return ref.onSnapshot(function (snap) {
          var data = snap.exists ? snap.data() : null;
          cb({
            ids: data && Array.isArray(data.ids) ? data.ids : null,
            quantities: data && data.quantities && typeof data.quantities === "object" ? data.quantities : {}
          });
        }, onErr);
      },
      setSelection: function (ids, quantities) { ref.set({ ids: ids, quantities: quantities || {}, updatedAt: new Date().toISOString() }); }
    };
  }
  function makeSelectionMemoryLayer() {
    var LS_KEY = "pv_budget_selection_v1";
    var persisted = safeLsGet(LS_KEY);
    var ids = persisted && Array.isArray(persisted.ids) ? persisted.ids : null;
    var quantities = persisted && persisted.quantities && typeof persisted.quantities === "object" ? persisted.quantities : {};
    var listeners = [];
    return {
      subscribe: function (cb) { listeners.push(cb); cb({ ids: ids, quantities: quantities }); return function () { listeners = listeners.filter(function (l) { return l !== cb; }); }; },
      setSelection: function (newIds, newQuantities) {
        ids = newIds; quantities = newQuantities || {};

        listeners.forEach(function (cb) { cb({ ids: ids, quantities: quantities }); });
      }
    };
  }

  /** Company-wide fixed costs (head office, admin, salaries — not tied to any one
   *  farm's own operations) are a single shared, portfolio-level setting, edited
   *  from the portfolio comparison view and persisted the same way as the
   *  selection: one small document everyone viewing the portfolio sees and shares. */
  function makeFixedCostsDbLayer(db) {
    var ref = db.doc("portfolio/fixed_costs");
    return {
      subscribe: function (cb, onErr) {
        return ref.onSnapshot(function (snap) {
          cb(snap.exists ? snap.data() : null);
        }, onErr);
      },
      setFixedCosts: function (fc) { ref.set(Object.assign({}, fc, { updatedAt: new Date().toISOString() })); }
    };
  }
  function makeFixedCostsMemoryLayer() {
    var LS_KEY = "pv_budget_fixed_costs_v1";
    var fc = safeLsGet(LS_KEY);
    var listeners = [];
    return {
      subscribe: function (cb) { listeners.push(cb); cb(fc); return function () { listeners = listeners.filter(function (l) { return l !== cb; }); }; },
      setFixedCosts: function (newFc) { fc = newFc; safeLsSet(LS_KEY, fc); listeners.forEach(function (cb) { cb(fc); }); }
    };
  }

  /* ============================================================
     APP STATE

  var state = {
    projects: [], loaded: false, view: "editor", selectedId: null, draft: null,
    compareSort: { key: "name", dir: "asc" }, selectedIds: null, resultsGranularity: "annual",
    fixedCosts: null, quantities: {}

  var saveTimer = null;
  var chartRefs = {};
  var formRenderedFor = null;
  var selectionLayer = null;
  var fixedCostsLayer = null;

  /** The Chart.js <script> tag loads synchronously before this app script
   *  runs, so `Chart` should normally already be defined by the time any
   *  build*Chart function is called. But on a slow network or a CDN hiccup
   *  that load can still be outstanding (or can fail and retry) when the
   *  user's first render happens — in that case the affected chart(s) would
   *  otherwise stay permanently blank because build*Chart's own `typeof
   *  Chart === "undefined"` guard just returns without ever trying again.
   *  This retries briefly (every 200ms, up to 5s) so a chart still appears
   *  once the library finishes loading, instead of requiring the user to
   *  manually switch views/tabs to trigger a re-render. onUnavailable (same
   *  pattern as whenExcelReady below) fires once the retry budget is
   *  exhausted, so the caller can show a visible message in the chart's
   *  container instead of leaving a permanently blank canvas with no
   *  explanation — this matters in particular when the page is viewed
   *  somewhere that blocks the external Chart.js CDN script entirely (e.g.
   *  a restrictive network or a sandboxed viewer), in which case `Chart`
   *  never becomes defined and the old silent-return behaviour gave no hint
   *  as to why. */
  function whenChartReady(fn, onUnavailable, attemptsLeft) {
    if (typeof Chart !== "undefined") { fn(); return; }
    if (attemptsLeft === undefined) attemptsLeft = 25;
    if (attemptsLeft <= 0) { if (onUnavailable) onUnavailable(); return; }
    setTimeout(function () { whenChartReady(fn, onUnavailable, attemptsLeft - 1); }, 200);
  }
  /** Shows a small explanatory message in place of a chart that never
   *  rendered because the Chart.js library failed to load, instead of
   *  leaving a blank .chart-wrap box with no explanation. Safe to call even
   *  if the canvas/container isn't found. */
  function showChartUnavailable(canvasId) {
    var canvas = document.getElementById(canvasId);
    var wrap = canvas ? canvas.closest(".chart-wrap") : null;
    if (!wrap) return;
    wrap.innerHTML = '<div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:12px; font-size:12.5px; line-height:1.5; color:var(--text-muted);">' +
      'Nie udało się załadować biblioteki wykresów (Chart.js) — sprawdź połączenie internetowe i odśwież stronę.<br>Jeśli oglądasz ten plik jako opublikowany Artefakt, spróbuj otworzyć pobrany plik HTML bezpośrednio w przeglądarce.' +
      '</div>';
  }
  /** Same load-race safety net as whenChartReady, for the ExcelJS library
   *  used by the "Eksport Excel" buttons (ExcelJS, not SheetJS — see the
   *  note above xlsAddFlatSheet below for why). onUnavailable fires once
   *  the retry budget is exhausted so the button can tell the user instead
   *  of silently doing nothing. */
  function whenExcelReady(fn, onUnavailable, attemptsLeft) {
    if (typeof ExcelJS !== "undefined") { fn(); return; }
    if (attemptsLeft === undefined) attemptsLeft = 25;
    if (attemptsLeft <= 0) { if (onUnavailable) onUnavailable(); return; }
    setTimeout(function () { whenExcelReady(fn, onUnavailable, attemptsLeft - 1); }, 200);
  }

  /* ============================================================
     EXCEL EXPORT STYLING (ExcelJS)
     ============================================================
     The exported .xlsx files used to be built with SheetJS's free
     "xlsx" (community) library, which can write cell VALUES but not
     styling — no fills, fonts, or borders — so every export was
     plain black-on-white text. ExcelJS is fully open-source and does
     support cell styling, so exports here are built with it instead:
     branded header rows, per-column number formats (thousands
     separators, PLN/MWh figures, years left unformatted, matching the
     in-app number-formatting rules — see fmt/groupThousands), borders,
     a frozen header row, and light zebra striping.

     Brand colors below are lifted directly from the app's own logo
     image (see .brand-logo-for-light in the markup, or PROJEKT_LOGO
     if you decode it): dark navy #1e3641 is both the logo's dominant
     color and this app's --accent CSS variable, so header/title fills
     reuse it for visual consistency between the on-screen app and the
     exported file; the pale green tint matches --accent-2-soft. */
  var XLS_NAVY = "FF1E3641";
  var XLS_GREEN_SOFT = "FFE1F3EA";
  var XLS_BORDER = "FFD7DBCD";
  var XLS_WHITE = "FFFFFFFF";
  var XLS_TEXT = "FF1B211D";
  var XLS_FONT = "Calibri";

  function xlsThinBorder(topStyle) {
    var top = { style: topStyle || "thin", color: { argb: topStyle ? XLS_NAVY : XLS_BORDER } };
    var side = { style: "thin", color: { argb: XLS_BORDER } };
    return { top: top, left: side, bottom: side, right: side };
  }

  /** Classifies a flat-sheet column by its header text (already carries the
   *  unit, e.g. "Przychód (PLN)"/"Produkcja (MWh)") so the right Excel
   *  number format / alignment can be applied without keeping a separate
   *  column-type table in sync with cfAoa/pnlAoa. Years are deliberately
   *  left as plain integers with no thousands separator, mirroring the
   *  in-app rule (data-numfield without data-thousands, see fieldNum) that
   *  a calendar year like "2027" should never read as "2 027". */
  function xlsColumnFormat(header) {
    if (header === "Rok" || header === "Rok kalendarzowy") return { numFmt: "0", align: "center" };
    if (header === "DSCR") return { numFmt: "0.00", align: "right" };
    if (/\(PLN\)|\(MWh\)/.test(header)) return { numFmt: "#,##0;[Red]-#,##0", align: "right" };
    if (header === "Pozycja") return { numFmt: undefined, align: "left" };
    return { numFmt: undefined, align: header === "Miesiąc" ? "left" : "center" };
  }

  /** Builds one branded worksheet from a plain array-of-arrays (aoa[0] is
   *  the header row, matching what cfAoa/pnlAoa already produce) — a navy
   *  title row, a navy header row with per-column alignment/number format
   *  inferred from the header text, thin borders, light zebra striping,
   *  auto-sized columns, a frozen header row and an autofilter. */
  function xlsAddFlatSheet(wb, sheetName, title, aoa) {
    var ws = wb.addWorksheet(sheetName, { views: [{ state: "frozen", ySplit: 2 }] });
    var header = aoa[0], dataRows = aoa.slice(1);
    var colFormats = header.map(xlsColumnFormat);

    ws.mergeCells(1, 1, 1, header.length);
    var titleCell = ws.getCell(1, 1);
    titleCell.value = title;
    titleCell.font = { name: XLS_FONT, size: 13, bold: true, color: { argb: XLS_WHITE } };
    titleCell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: XLS_NAVY } };
    titleCell.alignment = { vertical: "middle", horizontal: "left" };
    ws.getRow(1).height = 22;

    var headerRow = ws.getRow(2);
    header.forEach(function (h, i) {
      var c = headerRow.getCell(i + 1);
      c.value = h;
      c.font = { name: XLS_FONT, size: 10.5, bold: true, color: { argb: XLS_WHITE } };
      c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: XLS_NAVY } };
      c.alignment = { vertical: "middle", horizontal: colFormats[i].align, wrapText: true };
      c.border = xlsThinBorder();
    });
    headerRow.height = 28;

    dataRows.forEach(function (row, ri) {
      var r = ws.getRow(ri + 3);
      row.forEach(function (v, i) {
        var c = r.getCell(i + 1);
        c.value = v;
        if (colFormats[i].numFmt) c.numFmt = colFormats[i].numFmt;
        c.alignment = { horizontal: colFormats[i].align };
        c.border = xlsThinBorder();
        c.font = { name: XLS_FONT, size: 10.5, color: { argb: XLS_TEXT } };
        if (ri % 2 === 1) c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: XLS_GREEN_SOFT } };
      });
    });

    ws.autoFilter = { from: { row: 2, column: 1 }, to: { row: 2, column: header.length } };
    header.forEach(function (h, i) {
      var maxLen = h.length;
      dataRows.forEach(function (row) {
        var s = row[i] === null || row[i] === undefined ? "" : String(row[i]);
        if (s.length > maxLen) maxLen = s.length;
      });
      ws.getColumn(i + 1).width = Math.max(9, Math.min(30, maxLen + 2));
    });
    return ws;
  }

  /** Builds one branded worksheet from the statutoryPnLRows/
   *  statutoryBalanceRows row definitions plus the period rows (mirrors the
   *  level/emphasis styling the on-screen stat-table CSS classes apply —
   *  see renderStatutoryTable — stat-major/stat-sub/stat-final/
   *  stat-reconcile-head): bold section totals, indented line items, a
   *  highlighted double-bordered final row, an italic reconciling line, and
   *  full-width navy AKTYWA/PASYWA banners, so the exported statutory sheet
   *  reads the same way the on-screen table does. First column (labels)
   *  stays frozen alongside the header row since the full analysis horizon
   *  can run to dozens of period columns. */
  function xlsAddStatutorySheet(wb, sheetName, title, rowDefs, periodRows, isMonthly) {
    var ncols = 1 + periodRows.length;
    var ws = wb.addWorksheet(sheetName, { views: [{ state: "frozen", xSplit: 1, ySplit: 2 }] });

    ws.mergeCells(1, 1, 1, ncols);
    var titleCell = ws.getCell(1, 1);
    titleCell.value = title;
    titleCell.font = { name: XLS_FONT, size: 13, bold: true, color: { argb: XLS_WHITE } };
    titleCell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: XLS_NAVY } };
    titleCell.alignment = { vertical: "middle", horizontal: "left" };
    ws.getRow(1).height = 22;

    var headerRow = ws.getRow(2);
    // Portfolio period rows label the "Rok" column with the real calendar
    // year directly (r.year IS the calendar year there); single-project
    // period rows (m.yearRows / computeBalanceSheetSeries's yearRows) use a
    // sequential "Rok N" life-cycle index with the real year carried
    // separately as r.calendarYear, so those need the fuller "Rok N (rok
    // kalendarzowy)" label — detected by the presence of that field, since
    // only single-project rows carry it.
    var headerLabels = ["Pozycja"].concat(periodRows.map(function (r) {
      if (isMonthly) return r.year + " " + r.monthName;
      return r.calendarYear !== undefined ? ("Rok " + r.year + " (" + r.calendarYear + ")") : String(r.year);
    }));
    headerLabels.forEach(function (h, i) {
      var c = headerRow.getCell(i + 1);
      c.value = h;
      c.font = { name: XLS_FONT, size: 10.5, bold: true, color: { argb: XLS_WHITE } };
      c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: XLS_NAVY } };
      c.alignment = { vertical: "middle", horizontal: i === 0 ? "left" : "right" };
      c.border = xlsThinBorder();
    });
    headerRow.height = 26;

    rowDefs.forEach(function (def) {
      var r = ws.addRow([]);
      var labelCell = r.getCell(1);
      labelCell.value = def.label;
      labelCell.border = xlsThinBorder(def.final ? "double" : undefined);
      labelCell.alignment = { horizontal: "left", vertical: "middle", wrapText: true, indent: def.sub ? 1 : 0 };
      if (def.header) {
        // Full-width navy banner (AKTYWA / PASYWA) — no per-period values.
        ws.mergeCells(r.number, 1, r.number, ncols);
        labelCell.font = { name: XLS_FONT, bold: true, color: { argb: XLS_WHITE } };
        labelCell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: XLS_NAVY } };
        return;
      }
      labelCell.font = { name: XLS_FONT, size: 10.5, bold: !!(def.major || def.final), italic: !!def.reconcile, color: { argb: XLS_TEXT } };
      if (def.final) labelCell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: XLS_GREEN_SOFT } };
      periodRows.forEach(function (pr, ci) {
        var c = r.getCell(ci + 2);
        c.value = Math.round(def.value(pr));
        c.numFmt = "#,##0;[Red]-#,##0";
        c.font = { name: XLS_FONT, size: 10.5, bold: !!(def.major || def.final), italic: !!def.reconcile, color: { argb: XLS_TEXT } };
        c.alignment = { horizontal: "right" };
        c.border = xlsThinBorder(def.final ? "double" : undefined);
        if (def.final) c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: XLS_GREEN_SOFT } };
      });
    });

    ws.getColumn(1).width = 62;
    for (var ci2 = 2; ci2 <= ncols; ci2++) ws.getColumn(ci2).width = 14;
    return ws;
  }

  /** Serializes an ExcelJS workbook to a downloadable Blob and hands it to
   *  chartRefs.downloadsFn — shared tail end of exportResultsXlsx/
   *  exportPortfolioXlsx. writeBuffer() is async (unlike SheetJS's
   *  synchronous XLSX.write), hence the promise chain at each call site. */
  function xlsDownloadWorkbook(wb, filename) {
    return wb.xlsx.writeBuffer().then(function (buf) {
      var blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      return chartRefs.downloadsFn({ filename: filename, data: blob });
    });
  }

  function getFixedCosts() { return Object.assign({}, DEFAULT_FIXED_COSTS, state.fixedCosts || {}); }
  function setFixedCostsField(path, value) {
    var fc = getFixedCosts();
    setDeep(fc, path, value);
    state.fixedCosts = fc;
    if (fixedCostsLayer) fixedCostsLayer.setFixedCosts(fc);
    if (state.view === "compare") renderCompare();
  }

  function getSelectedIds() {
    var validIds = state.projects.map(function (p) { return p.id; });
    if (state.selectedIds === null) return validIds;
    return state.selectedIds.filter(function (id) { return validIds.indexOf(id) !== -1; });
  }
  function setSelectedIds(ids) { state.selectedIds = ids; if (selectionLayer) selectionLayer.setSelection(ids, state.quantities); }
  function toggleSelection(id) {
    var current = getSelectedIds(); var idx = current.indexOf(id); var next = current.slice();
    if (idx >= 0) next.splice(idx, 1); else next.push(id);
    setSelectedIds(next); if (state.view === "compare") renderCompare();
  }
  /** How many times a project's cash flows should be counted in the portfolio
   *  aggregate — lets a user model building the same farm N times without
   *  having to duplicate the project itself. Defaults to 1 (normal single
   *  count) for any project without an explicit quantity set. */
  function getQuantity(id) {
    var q = state.quantities && state.quantities[id];
    var n = Math.round(num(q, 1));
    return n >= 1 ? n : 1;
  }
  function setQuantity(id, qty) {
    var n = Math.max(1, Math.round(num(qty, 1)));
    state.quantities = Object.assign({}, state.quantities || {});
    state.quantities[id] = n;
    if (selectionLayer) selectionLayer.setSelection(getSelectedIds(), state.quantities);
    if (state.view === "compare") renderCompare();
  }
  function selectAllPortfolio() { setSelectedIds(state.projects.map(function (p) { return p.id; })); if (state.view === "compare") renderCompare(); }
  function selectNonePortfolio() { setSelectedIds([]); if (state.view === "compare") renderCompare(); }

  function scheduleSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      if (state.selectedId && state.draft) {
        var data = deepClone(state.draft);
        delete data.id;
        data.updatedAt = new Date().toISOString();
        dataLayer.update(state.selectedId, data);
      }
    }, 500);
  }

  function findProject(id) { for (var i = 0; i < state.projects.length; i++) if (state.projects[i].id === id) return state.projects[i]; return null; }

  function selectProject(id) {
    state.selectedId = id; state.view = "editor";
    var proj = findProject(id);
    state.draft = proj ? deepClone(proj) : null;
    formRenderedFor = null;
    renderAll();
  }

  function createProject(overrides) {
    var data = defaultProject(overrides);
    data.createdAt = new Date().toISOString(); data.updatedAt = data.createdAt;
    dataLayer.add(data).then(function (id) {
      state.selectedId = id; state.draft = Object.assign({ id: id }, deepClone(data)); state.view = "editor";
      formRenderedFor = null; renderAll();
    });
  }
  function deleteProject(id) {
    dataLayer.remove(id).then(function () { if (state.selectedId === id) { state.selectedId = null; state.draft = null; } });
  }

  /* ============================================================
     RENDER: SIDEBAR
     ============================================================ */
  function storageBadge(p) { return (p.storage && p.storage.enabled) ? '<span class="badge badge-accent2">+MAG</span>' : ""; }

  function renderSidebar() {
    var list = document.getElementById("project-list");
    if (!state.loaded) { list.innerHTML = '<div class="sidebar-note">Ładowanie portfela…</div>'; return; }
    if (state.projects.length === 0) {
      list.innerHTML = '<div class="sidebar-note">Brak projektów. Dodaj pierwszą farmę PV, aby rozpocząć budżetowanie.</div>';
      return;
    }
    var sorted = state.projects.slice().sort(function (a, b) { return (a.name || "").localeCompare(b.name || "", "pl"); });
    var html = "";
    sorted.forEach(function (p) {
      var m; try { m = computeMetrics(p); } catch (e) { m = null; }
      var badgeClass = "badge-neutral", badgeText = "–";
      if (m && m.irrEquity !== null) {
        badgeText = fmtPct(m.irrEquity, 1);
        badgeClass = m.irrEquity >= 0.08 ? "badge-pos" : (m.irrEquity < 0 ? "badge-neg" : "badge-neutral");
      }
      var active = p.id === state.selectedId ? " active" : "";
      html += '<button class="project-item' + active + '" data-select="' + p.id + '">' +
        '<div class="project-item-top"><span class="project-item-name">' + escapeHtml(p.name || "Bez nazwy") + '</span>' +
        '<span class="badge ' + badgeClass + '">' + badgeText + '</span></div>' +
        '<div class="project-item-meta"><span class="project-item-meta-left">' + escapeHtml(p.location || "—") + storageBadge(p) + '</span><span>' + fmt(p.pv.power_kwp, 0) + ' kWp</span></div>' +
        '</button>';
    });
    list.innerHTML = html;
    list.querySelectorAll("[data-select]").forEach(function (btn) {
      btn.addEventListener("click", function () { selectProject(btn.getAttribute("data-select")); });
    });
  }

  /* ============================================================
     RENDER: EDITOR FORM
     ============================================================ */
  // A plain text input (not type="number") so we can display space-separated
  // thousands (e.g. "300 000") while typing — see formatNumericInputValue/
  // reformatNumericInput. data-numfield="1" marks it as a numeric field for
  // parsing/styling purposes; data-thousands="1" additionally marks it for
  // the live space-grouping wiring and for unformatting its value back to a
  // plain number on read. Calendar-year fields (unit === "rok", e.g. "Rok
  // uruchomienia") are deliberately left WITHOUT the thousands grouping —
  // "2 027" for a year reads oddly — so they get data-numfield only.
  function fieldNum(path, label, unit, step) {
    var v = getDeep(state.draft, path);
    var id = "f-" + path.replace(/\./g, "-");
    var isYear = unit === "rok";
    var displayVal = v === undefined ? "" : (isYear ? String(v) : formatNumericInputValue(String(v)));
    return '<div class="field"><label for="' + id + '">' + label + '</label>' +
      '<div class="input-wrap"><input type="text" inputmode="decimal" data-numfield="1"' + (isYear ? "" : ' data-thousands="1"') + ' id="' + id + '" data-path="' + path + '" value="' + displayVal + '">' +
      (unit ? '<span class="unit">' + unit + '</span>' : "") + '</div></div>';
  }
  function fieldSelect(path, label, options) {
    var v = getDeep(state.draft, path);
    var id = "f-" + path.replace(/\./g, "-");
    var opts = options.map(function (o) { return '<option value="' + o.value + '"' + (String(v) === String(o.value) ? " selected" : "") + '>' + o.label + "</option>"; }).join("");
    return '<div class="field"><label for="' + id + '">' + label + '</label><select id="' + id + '" data-path="' + path + '" data-numeric="1">' + opts + "</select></div>";
  }
  // Same field markup as fieldNum/fieldSelect, but reading/writing the portfolio-
  // level fixed-costs object (via data-fcpath) instead of the project draft.
  function fcFieldNum(fc, key, label, unit, step) {
    var v = fc[key];
    var id = "f-fc-" + key;
    var isYear = unit === "rok";
    var displayVal = v === undefined ? "" : (isYear ? String(v) : formatNumericInputValue(String(v)));
    return '<div class="field"><label for="' + id + '">' + label + '</label>' +
      '<div class="input-wrap"><input type="text" inputmode="decimal" data-numfield="1"' + (isYear ? "" : ' data-thousands="1"') + ' id="' + id + '" data-fcpath="' + key + '" value="' + displayVal + '">' +
      (unit ? '<span class="unit">' + unit + '</span>' : "") + '</div></div>';
  }
  function fcFieldSelect(fc, key, label, options) {
    var v = fc[key];
    var id = "f-fc-" + key;
    var opts = options.map(function (o) { return '<option value="' + o.value + '"' + (String(v) === String(o.value) ? " selected" : "") + '>' + o.label + "</option>"; }).join("");
    return '<div class="field"><label for="' + id + '">' + label + '</label><select id="' + id + '" data-fcpath="' + key + '" data-numeric="1">' + opts + "</select></div>";
  }

    main.innerHTML =

      '<div><h2 id="proj-title-display">' + escapeHtml(p.name || "Bez nazwy") + '</h2>' +
      '<div class="subtitle">' + escapeHtml(p.location || "Brak lokalizacji") + ' · ' + fmt(p.pv.power_kwp, 0) + ' kWp' + (p.storage.enabled ? " · + magazyn energii" : "") + '</div></div>' +
      '<div class="header-actions">' +
      '<button class="btn btn-sm" id="btn-duplicate">Duplikuj</button>' +
      '<button class="btn btn-sm btn-danger-arm" id="btn-delete">Usuń projekt</button>' +
      '</div></div>' +
      '<div class="tabs">' +
      '<button class="tab-btn active" data-tab="inputs">Dane wejściowe</button>' +

      '<div id="tab-inputs"></div>' +

        btn.classList.add("active");

        document.getElementById("tab-results").hidden = tab !== "results";

  function techFieldsHtml(prefix, capexLabels, opexLabels, isStorage) {
    var d = state.draft[prefix];
    var powerMW = isStorage ? num(d.power_mw) : num(d.power_kwp) / 1000;
    var capexTotal = techCapexTotal(d, powerMW);
    var opexAnnual = techOpexAnnual(d.opex, powerMW);
    var finAmt = techFinancingAmounts(d, capexTotal);
    var financingType = d.financing.type === "stala" ? "stala" : "malejaca";

    var capexMode = d.capex_mode === "total" ? "total" : "detailed";
    var capexModeToggle =
      '<div class="segmented" style="margin-bottom:12px;">' +
      '<button type="button" data-capexmode="' + prefix + ':detailed" class="' + (capexMode === "detailed" ? "active" : "") + '">Szczegółowo</button>' +
      '<button type="button" data-capexmode="' + prefix + ':total" class="' + (capexMode === "total" ? "active" : "") + '">Łącznie (PLN/MW)</button>' +
      '</div>';
    // Each itemized CAPEX line carries its OWN tax-depreciation period (and
    // the rate that implies, 100/lat) rather than one project-wide rate — a
    // transformer station and PV modules legitimately depreciate at different
    // rates. "grunt" (land) gets a note instead of a rate field: land is not
    // a depreciable asset for tax purposes in Poland.
    var capexFields = "";
    for (var k in capexLabels) {
      // Przyłącze do sieci OSD, Projekt i dokumentacja, and Inne/pozostałe
      // (koszty jednorazowe) moved out to the "Koszty jednorazowe" module
      // (see oneTimeCostsCardHtml) — still part of pv.capex/
      // pv.capex_depreciation_years underneath (same field paths), just
      // rendered in a different card, so CAPEX totals, depreciation and
      // financing are unaffected.
      if (prefix === "pv" && PV_ONE_TIME_KEYS.indexOf(k) !== -1) continue;
      if (k === "grunt") {
        capexFields += '<div class="capex-item-row">' +

      } else {

        var rateK = depYearsKVal > 0 ? (100 / depYearsKVal) : 0;
        capexFields += '<div class="capex-item-row">' +
          fieldNum(prefix + ".capex." + k, capexLabels[k], "PLN", "1000") +
          fieldNum(prefix + ".capex_depreciation_years." + k, "Okres amortyzacji", "lat", "1") +
          '<div class="dep-rate-hint" data-deprate="' + prefix + ':' + k + '">Stawka: ' + rateK.toFixed(2) + '%/rok</div>' +
          '</div>';
      }
    }
    var oneTimeForNote = prefix === "pv" ? pvOneTimeCostsTotal(d) : 0;
    var scalableCapexNote = fmt(powerMW, 2) + ' MW × ' + fmt(num(d.capex_total_per_mw_pln), 0) + ' PLN/MW = <b class="money">' + fmt(num(d.capex_total_per_mw_pln) * powerMW, 0) + ' PLN</b>';
    var capexBody = capexMode === "total"
      ? '<div class="field-grid cols-2">' + fieldNum(prefix + ".capex_total_per_mw_pln", "CAPEX total", "PLN/MW", "1000") + '</div>' +
        '<div class="assumption-note">Skalująca się z mocą część CAPEX = ' + scalableCapexNote +
        (oneTimeForNote > 0 ? ' + koszty jednorazowe (przyłącze, projekt/dokumentacja, inne/pozostałe — sekcja „Koszty jednorazowe” poniżej) <b class="money">' + fmt(oneTimeForNote, 0) + ' PLN</b>' : '') +
        ' = łącznie <b class="money">' + fmt(capexTotal, 0) + ' PLN</b>. W tym trybie rozbicie skalującej się części na poszczególne pozycje (panele, inwertery itd.) nie jest uwzględniane w obliczeniach ani w amortyzacji — stosowana jest jedna stawka z sekcji „Podatki i stopa dyskontowa”; koszty jednorazowe zawsze amortyzowane są jednak własną, osobno wskazaną stawką.</div>'
      : '<div class="capex-items-list">' + capexFields + '</div>';
    var opexFields = "";
    for (var k2 in opexLabels) {
      opexFields += fieldNum(prefix + ".opex." + k2, opexLabels[k2], OPEX_UNITS[k2], "0.1");
      // Dzierżawa gruntu is paid once a year (not spread monthly like the
      // rest of OPEX) — these two fields, shown right next to the annual
      // rate above, choose when: the calendar year of the first payment and

      if (k2 === "dzierzawa_pln_mw") {
        opexFields += fieldNum(prefix + ".opex.dzierzawa_start_year", "Dzierżawa — rok pierwszej płatności", "rok", "1") +
          fieldSelect(prefix + ".opex.dzierzawa_payment_month", "Dzierżawa — miesiąc płatności", MONTH_OPTIONS);
      }
    }

    var sizingFields = isStorage
      ? fieldNum("storage.power_mw", "Moc magazynu", "MW", "0.1") + fieldNum("storage.throughput_mwh_mw", "Przerzut energii z 1 MW", "MWh/MW/rok", "10")
      : fieldNum("pv.power_kwp", "Moc instalacji", "kWp", "10");

    var productionFields = isStorage
      ? fieldNum("storage.degradation_pct", "Degradacja pojemności", "%/rok", "0.1")
      : fieldNum("pv.production.specific_yield_kwh_kwp", "Uzysk specyficzny", "kWh/kWp/rok", "1") + fieldNum("pv.production.degradation_pct", "Degradacja paneli", "%/rok", "0.1");

    var html =
      '<div class="card section"><div class="section-head"><h3>' + (isStorage ? "Magazyn energii — dane i CAPEX" : "Fotowoltaika — dane i CAPEX") + '</h3>' +
      '<div class="section-sum" id="' + prefix + '-capex-sum">CAPEX: <b class="money">' + fmt(capexTotal, 0) + ' PLN</b></div></div>' +
      '<div class="field-grid cols-2" style="margin-bottom:14px;">' +
      sizingFields +
      fieldSelect(prefix + ".commissioning_month", "Miesiąc uruchomienia", MONTH_OPTIONS) +
      fieldNum(prefix + ".commissioning_year", "Rok uruchomienia", "rok", "1") +
      '</div>' + capexModeToggle + capexBody + '</div>' +

      '<div class="card section"><div class="section-head"><h3>' + (isStorage ? "Magazyn — OPEX i przychody" : "Fotowoltaika — OPEX i przychody") + '</h3>' +
      '<div class="section-sum" id="' + prefix + '-opex-sum">OPEX (rok 1): <b class="money">' + fmt(opexAnnual, 0) + ' PLN/rok</b></div></div>' +
      '<div class="field-grid">' + opexFields + fieldNum(prefix + ".opex_escalation_pct", "Indeksacja OPEX", "%/rok", "0.1") + '</div>' +
      '<div class="field-grid cols-2" style="margin-top:12px;">' +
      productionFields +
      fieldNum(prefix + ".revenue.price_pln_mwh", isStorage ? "Cena energii z magazynu (arbitraż)" : "Cena sprzedaży energii", "PLN/MWh", "1") +
      fieldNum(prefix + ".revenue.price_escalation_pct", "Indeksacja ceny", "%/rok", "0.1") +
      '</div>' +
      '<div class="assumption-note">Dzierżawa gruntu jest płatna jednorazowo raz w roku — w miesiącu wskazanym powyżej, począwszy od wskazanego roku — a nie rozłożona na raty miesięczne jak pozostałe pozycje OPEX. Pozostałe koszty (obsługa techniczna, ubezpieczenia) nadal rozliczane są równomiernie w każdym miesiącu.' +
      (isStorage ? " Cena energii uzyskiwanej z arbitrażu magazynu jest ustawiana niezależnie od ceny sprzedaży energii z PV powyżej — magazyn ładuje się i rozładowuje w oparciu o zmienność cen na rynku, więc jego przychód na MWh zwykle różni się (najczęściej jest wyższy) od ceny PV." : "") + '</div>' +
      (!isStorage ? (
        '<div class="field-grid cols-2" style="margin-top:12px;">' +
        fieldNum("pv.revenue.price_go_pln_mwh", "Gwarancje pochodzenia energii", "PLN/MWh", "0.1") +
        fieldNum("pv.revenue.price_go_escalation_pct", "Indeksacja ceny GO", "%/rok", "0.1") +
        fieldNum("pv.revenue.inne_przychody_pln_rok", "Inne/pozostałe przychody", "PLN/rok", "100") +
        '</div>' +
        '<div class="assumption-note">Gwarancje pochodzenia energii (GO) to osobny, dodatkowy przychód za każdą MWh wyprodukowanej energii z OZE — rozliczany niezależnie od samej energii (np. przez Rejestr Gwarancji Pochodzenia prowadzony przez TGE, na podstawie wniosku do Prezesa URE), nie jest częścią ceny energii powyżej. Rynek GO jest obecnie w nadpodaży, a ceny mocno spadły i pozostają zmienne — domyślna stawka (2,5 PLN/MWh) odzwierciedla bieżącą ofertę rynkową i jest w pełni edytowalna, podobnie jak jej własna indeksacja (domyślnie 0%/rok, niezależna od indeksacji ceny energii powyżej). „Inne/pozostałe przychody” to stała kwota roczna na drobne źródła przychodu niezwiązane z produkcją (np. dzierżawa fragmentu terenu pod baner reklamowy) — indeksowana tą samą stopą co OPEX powyżej.</div>'
      ) : "") +
      '</div>' +

      '<div class="card section"><div class="section-head"><h3>' + (isStorage ? "Magazyn — finansowanie" : "Fotowoltaika — finansowanie") + '</h3>' +
      '<div class="section-sum" id="' + prefix + '-fin-sum">Dług: <b class="money">' + fmt(finAmt.debtAmt, 0) + ' PLN</b> · Wkład własny: <b class="money">' + fmt(finAmt.equityAmt, 0) + ' PLN</b></div></div>' +
      '<div class="segmented" style="margin-bottom:12px;">' +
      '<button type="button" data-fintype="' + prefix + ':malejaca" class="' + (financingType === "malejaca" ? "active" : "") + '">Raty malejące</button>' +
      '<button type="button" data-fintype="' + prefix + ':stala" class="' + (financingType === "stala" ? "active" : "") + '">Raty stałe</button>' +
      '</div>' +
      '<div class="field-grid cols-2" style="margin-bottom:12px;">' +
      fieldSelect(prefix + ".financing.start_month", "Miesiąc rozpoczęcia finansowania", MONTH_OPTIONS) +
      fieldNum(prefix + ".financing.start_year", "Rok rozpoczęcia finansowania", "rok", "1") +
      '</div>' +
      '<div class="field-grid">' +
      fieldNum(prefix + ".financing.debt_share_pct", "Udział długu", "%", "1") +
      fieldNum(prefix + ".financing.wibor_pct", "WIBOR", "%", "0.01") +
      fieldNum(prefix + ".financing.marza_pct", "Marża", "%", "0.01") +
      fieldNum(prefix + ".financing.loan_term_years", "Okres finansowania", "lat", "1") +
      fieldNum(prefix + ".financing.grace_months", "Karencja w spłacie kapitału", "miesięcy", "1") +
      '</div>' +
      '<div class="assumption-note">Data rozpoczęcia finansowania to moment poniesienia CAPEX i wpłaty wkładu własnego oraz uruchomienia kredytu/leasingu — niezależny od daty uruchomienia (komisjonowania) farmy powyżej; w typowym projekcie poprzedza uruchomienie o czas budowy. Karencja w spłacie kapitału liczona jest od tej daty (przez wskazaną liczbę miesięcy płacone są tylko odsetki), niezależnie od tego, kiedy farma faktycznie zacznie generować przychód.' +
      (financingType === "stala"
        ? " Raty stałe (annuitetowe): łączna rata (kapitał + odsetki) jest stała przez cały okres spłaty — udział kapitału w racie rośnie, a udział odsetek maleje w miarę spłaty zadłużenia."
        : " Raty malejące: stała rata kapitałowa przez cały okres spłaty — łączna rata (kapitał + odsetki) maleje z czasem wraz ze spadkiem salda i odsetek.") + '</div>' +
      '</div>';

    var profileArr = Array.isArray(d.monthly_profile_pct) ? d.monthly_profile_pct : [];
    var profileSum = profileArr.reduce(function (a, b) { return a + num(b); }, 0);
    var monthFields = "";
    for (var mi = 0; mi < 12; mi++) {
      monthFields += fieldNum(prefix + ".monthly_profile_pct." + mi, MONTH_NAMES_PL[mi].charAt(0).toUpperCase() + MONTH_NAMES_PL[mi].slice(1), "%", "0.01");
    }
    var profileNote = isStorage
      ? "Rozkład wykorzystania (rozładowań) magazynu w ciągu roku — kierowany opłacalnością arbitrażu cenowego, nie nasłonecznieniem: w typowym profilu wyższy zimą (większa zmienność cen, mniej PV do arbitrażu), niższy latem. Wartości domyślne wyznaczone na podstawie rzeczywistej symulacji dyspozycji magazynu."
      : "Rozkład produkcji PV w ciągu roku wynika z nasłonecznienia — najniższy w grudniu/styczniu, szczyt w maju–lipcu. Wartości domyślne odpowiadają przyjętemu w firmie rocznemu rozkładowi produkcji FV; edytuj je, jeśli masz dane specyficzne dla Twojej farmy (np. z raportu PVGIS/PVsyst).";

    html += '<div class="card section"><div class="section-head"><h3>' + (isStorage ? "Magazyn — profil miesięczny wykorzystania" : "Fotowoltaika — profil miesięczny produkcji") + '</h3>' +
      '<div style="display:flex;gap:12px;align-items:center;">' +
      '<span class="hint">Suma: ' + profileSum.toFixed(2) + '% (powinno wynosić 100%)</span>' +
      '<button type="button" class="btn btn-sm" data-resetprofile="' + prefix + '">Resetuj do domyślnych</button>' +
      '</div></div>' +
      '<div class="month-grid">' + monthFields + '</div>' +
      '<div class="assumption-note">' + profileNote + '</div></div>';

    return html;
  }

  /** "Koszty jednorazowe" — one-time-cost items for the PV farm: przyłącze
   *  do sieci OSD, projekt/dokumentacja, and inne/pozostałe (same pv.capex/
   *  pv.capex_depreciation_years fields underneath, PV_ONE_TIME_KEYS). These
   *  are ALWAYS shown here as editable fields, regardless of whether the main
   *  PV CAPEX card is in "Szczegółowo" (itemized) or "Łącznie" (aggregate
   *  PLN/MW) mode — unlike the rest of CAPEX, they don't scale with power, so
   *  they can't sensibly live inside a per-MW rate. They are always added
   *  independently on top of whatever CAPEX-mode figure is used (see
   *  techCapexTotal / pvOneTimeCostsTotal). przylacze and projekt_dokumentacja
   *  are always depreciated on their own schedule (see
   *  techDepreciationSchedule) — never folded into or derived from the
   *  "CAPEX total" toggle. "inne_jednorazowe" additionally carries its own
   *  "Amortyzować" checkbox (capex_amortize_inne_jednorazowe) — checked (the
   *  default) depreciates it on its own schedule just like the other two;
   *  unchecked expenses it in full in the month it's incurred instead (see
   *  itemDepreciationMonths), for costs that don't really qualify as a
   *  depreciable fixed asset. Also shows a read-only readout of PV's wkład
   *  własny (the equity contribution due at financing close — see
   *  techFinancingAmounts) as its own one-time cash outlay. Storage's own
   *  equity contribution is unaffected and still shown in the "Magazyn —
   *  finansowanie" card as before. */
  function oneTimeCostsCardHtml(p) {
    var d = p.pv;
    var powerMW = num(d.power_kwp) / 1000;
    var capexTotal = techCapexTotal(d, powerMW);
    var finAmt = techFinancingAmounts(d, capexTotal);
    var oneTimeTotal = pvOneTimeCostsTotal(d);
    var rows = '<div class="capex-items-list">' + PV_ONE_TIME_KEYS.map(function (k) {
      var depYearsK = getDeep(d, "capex_depreciation_years." + k);
      var depYearsKVal = depYearsK === undefined ? 10 : num(depYearsK, 10);
      var rateK = depYearsKVal > 0 ? (100 / depYearsKVal) : 0;
      if (k === "inne_jednorazowe") {
        var amortize = d.capex_amortize_inne_jednorazowe !== false;

          fieldNum("pv.capex." + k, PV_CAPEX_LABELS[k], "PLN", "1000") +

    return '<div class="card section"><div class="section-head"><h3>Koszty jednorazowe</h3>' +
      '<div class="section-sum" id="pv-onetime-sum">Razem: <b class="money">' + fmt(oneTimeTotal, 0) + ' PLN</b></div></div>' +
      rows +
      '<div class="one-time-readout-row"><span class="one-time-readout-label">Wkład własny do finansowania farmy PV</span><span class="one-time-readout-value money" id="pv-onetime-equity-value">' + fmt(finAmt.equityAmt, 0) + ' PLN</span></div>' +
      '<div class="assumption-note">Przyłącze do sieci OSD, koszty projektu/dokumentacji oraz Inne/pozostałe to pozycje jednorazowe, niezależne od trybu CAPEX farmy PV powyżej (Szczegółowo / Łącznie) — edytujesz je tutaj zawsze, niezależnie od wybranego trybu. Doliczają się w całości do łącznego CAPEX farmy PV — w trybie „Łącznie (PLN/MW)” kwota PLN/MW powyżej powinna obejmować tylko koszty skalujące się z mocą (panele, inwertery, konstrukcję itd.), bez tych trzech pozycji, ponieważ są doliczane osobno. Przyłącze i projekt/dokumentacja są zawsze amortyzowane własną, wskazaną tutaj stawką. Pozycja „Inne/pozostałe” ma dodatkowo checkbox „Amortyzować” — zaznaczony (domyślnie) rozlicza ją tak samo amortyzacyjnie na wskazaną liczbę lat; odznaczony ujmuje cały koszt jednorazowo, w całości, w miesiącu poniesienia (bez amortyzacji) — przydatne dla kosztów, które nie kwalifikują się jako środek trwały podlegający amortyzacji. Cykliczne, powtarzające się co roku koszty utrzymania terenu (np. coroczne koszenie trawy, bieżące naprawy drogi dojazdowej) nie są kosztem jednorazowym — wpisz je jako roczną kwotę w polu „Inne/pozostałe” w sekcji „OPEX i przychody” poniżej, gdzie rozliczane są na bieżąco co roku. Wkład własny to wymagana jednorazowa wpłata kapitału własnego w momencie finansowania (CAPEX pomniejszony o kwotę kredytu) — ustawiana pośrednio przez udział długu w sekcji „Fotowoltaika — finansowanie” poniżej; pole tutaj jest tylko podglądem.</div>' +

    document.getElementById("tab-inputs").innerHTML = html;

    document.getElementById("tab-inputs").querySelectorAll("[data-path]").forEach(function (input) {

      var evt = (isCheckbox || isSelect) ? "change" : "input";
      input.addEventListener(evt, function () {
        // Live space-thousands reformat as the user types, before reading the

        // Calendar-year fields (data-numfield without data-thousands, e.g.

        var path = input.getAttribute("data-path");

        if (isCheckbox) value = input.checked;

          var powerMW = techPrefix === "storage" ? num(d.power_mw) : num(d.power_kwp) / 1000;

  /* ============================================================
     STATUTORY RZiS / BILANS (single project)
     ============================================================ */
  /** Turns computeMetrics's flow-only monthRows into a running balance sheet
   *  for a SINGLE project: cumulative CAPEX/depreciation give net fixed
   *  assets, cumulative debt drawn/repaid gives the outstanding loan
   *  balance, cumulative equity contributed + retained earnings gives total
   *  equity, and cash is backed out from the same cumulative equity cash
   *  flow (r.cumEquity) computeMetrics already tracks — plus the equity
   *  contributed back in, since equityFCF nets the contribution out of the
   *  investor's own cash position but the project's own cash account
   *  receives it as an inflow. This mirrors the portfolio-level balance-
   *  sheet derivation (see computePortfolioAggregate), just for one project
   *  with no company-wide fixed costs to layer in. Returns
   *  { monthRows, yearRows } — yearRows is a year-END SNAPSHOT of these
   *  stock fields (not a sum — a balance sheet is a stock, not a flow),
   *  looked up by matching each m.yearRows bucket's real calendarYear
   *  against the last monthRow carrying that same calendar year (yearRows
   *  buckets are no longer guaranteed to be exactly 12 months each — see
   *  the calendar-aligned annual rollup in computeMetrics — so this does
   *  NOT assume a fixed 12-months-per-year offset). */
  function computeBalanceSheetSeries(m) {
    var monthRows = [];
    var cumCapexOut = 0, cumDep = 0, cumDebtDrawn = 0, cumPrincipal = 0, cumEquityContributed = 0, cumRetained = 0;
    var yearStartRetained = 0, lastCalYear = null;
    m.monthRows.forEach(function (r) {
      if (r.year !== lastCalYear) { yearStartRetained = cumRetained; lastCalYear = r.year; }
      cumCapexOut += r.capexOut; cumDep += r.depreciation; cumDebtDrawn += r.debtDrawn; cumPrincipal += r.principal;
      cumEquityContributed += r.equityOut; cumRetained += r.netIncome;
      var cash = r.cumEquity + cumEquityContributed;
      var fixedAssetsNet = cumCapexOut - cumDep;
      var debtBalance = cumDebtDrawn - cumPrincipal;
      var assets = cash + fixedAssetsNet;
      var equityTotal = cumEquityContributed + cumRetained;
      monthRows.push({
        year: r.year, month: r.month, monthName: r.monthName,
        cash: cash, fixedAssetsNet: fixedAssetsNet, debtBalance: debtBalance, assets: assets,
        contributedCapital: cumEquityContributed, retainedEarnings: cumRetained, equityTotal: equityTotal,
        retainedEarningsPriorYears: yearStartRetained, retainedEarningsCurrentYear: cumRetained - yearStartRetained,
        liabEquityTotal: debtBalance + equityTotal
      });
    });
    // Split the outstanding debt balance at each row into short-term
    // (principal due within the next 12 months) and long-term (the rest),
    // as required for a statutory balance sheet — needs a look-ahead over
    // the already-built schedule, so it runs as a second pass.
    for (var i = 0; i < monthRows.length; i++) {
      var next12Principal = 0;
      for (var j = i + 1; j < monthRows.length && j <= i + 12; j++) next12Principal += m.monthRows[j].principal;
      var totalDebtBal = monthRows[i].debtBalance;
      var shortTerm = Math.min(Math.max(next12Principal, 0), Math.max(totalDebtBal, 0));
      monthRows[i].debtShortTerm = shortTerm;
      monthRows[i].debtLongTerm = totalDebtBal - shortTerm;
    }
    // Annual: year-end snapshot, matched by real calendar year (not a fixed
    // 12-months-per-bucket offset — see the note above).
    var lastIdxByCalYear = {};
    monthRows.forEach(function (r, idx) { lastIdxByCalYear[r.year] = idx; });
    var yearRows = [];
    m.yearRows.forEach(function (yr) {
      var lr = monthRows[lastIdxByCalYear[yr.calendarYear]];
      yearRows.push({
        year: yr.year, calendarYear: yr.calendarYear,
        cash: lr.cash, fixedAssetsNet: lr.fixedAssetsNet, debtBalance: lr.debtBalance, assets: lr.assets,
        debtShortTerm: lr.debtShortTerm, debtLongTerm: lr.debtLongTerm,
        contributedCapital: lr.contributedCapital, retainedEarnings: lr.retainedEarnings, equityTotal: lr.equityTotal,
        liabEquityTotal: lr.liabEquityTotal, retainedEarningsPriorYears: lr.retainedEarningsPriorYears, retainedEarningsCurrentYear: lr.retainedEarningsCurrentYear
      });
    });
    return { monthRows: monthRows, yearRows: yearRows };
  }

  /** Row definitions for a single project's RZiS in full statutory form
   *  (wariant porównawczy, per Załącznik nr 1 do ustawy o rachunkowości) —
   *  reads directly off computeMetrics's own monthRows/yearRows (revenue,
   *  opex split into opexServices/opexTaxes, depreciation, interest, tax,
   *  netIncome), no separate aggregation needed. Positions with no single-
   *  project equivalent (stock changes, wages, financial income — this
   *  model has no employees or securities) are shown as statutory 0,
   *  matching the required Załącznik nr 1 layout. Distinct from
   *  statutoryPnLRows (portfolio view), which adds the two reconciliation
   *  rows for company-wide fixed costs that don't apply to a single
   *  project's own RZiS. */
  function singleProjectPnLRows() {
    var z = function () { return 0; };
    return [
      { label: "A. Przychody netto ze sprzedaży i zrównane z nimi, w tym:", major: true, value: function (r) { return r.revenue; } },
      { label: "I. Przychody netto ze sprzedaży produktów", sub: true, value: function (r) { return r.revenue; } },
      { label: "II. Zmiana stanu produktów", sub: true, value: z },
      { label: "III. Koszt wytworzenia produktów na własne potrzeby jednostki", sub: true, value: z },
      { label: "IV. Przychody netto ze sprzedaży towarów i materiałów", sub: true, value: z },
      { label: "B. Koszty działalności operacyjnej", major: true, value: function (r) { return r.depreciation + r.opex; } },
      { label: "I. Amortyzacja", sub: true, value: function (r) { return r.depreciation; } },
      { label: "II. Zużycie materiałów i energii", sub: true, value: z },
      { label: "III. Usługi obce", sub: true, value: function (r) { return r.opexServices; } },
      { label: "IV. Podatki i opłaty, w tym podatek akcyzowy", sub: true, value: function (r) { return r.opexTaxes; } },
      { label: "V. Wynagrodzenia", sub: true, value: z },
      { label: "VI. Ubezpieczenia społeczne i inne świadczenia", sub: true, value: z },
      { label: "VII. Pozostałe koszty rodzajowe", sub: true, value: z },
      { label: "VIII. Wartość sprzedanych towarów i materiałów", sub: true, value: z },
      { label: "C. Zysk (strata) ze sprzedaży (A−B)", major: true, value: function (r) { return r.revenue - (r.depreciation + r.opex); } },
      { label: "D. Pozostałe przychody operacyjne", major: true, value: z },
      { label: "I. Zysk z tytułu rozchodu niefinansowych aktywów trwałych", sub: true, value: z },
      { label: "II. Dotacje", sub: true, value: z },
      { label: "III. Aktualizacja wartości aktywów niefinansowych", sub: true, value: z },
      { label: "IV. Inne przychody operacyjne", sub: true, value: z },
      { label: "E. Pozostałe koszty operacyjne", major: true, value: z },
      { label: "I. Strata z tytułu rozchodu niefinansowych aktywów trwałych", sub: true, value: z },
      { label: "II. Aktualizacja wartości aktywów niefinansowych", sub: true, value: z },
      { label: "III. Inne koszty operacyjne", sub: true, value: z },
      { label: "F. Zysk (strata) z działalności operacyjnej (C+D−E)", major: true, value: function (r) { return r.ebitda - r.depreciation; } },
      { label: "G. Przychody finansowe", major: true, value: z },
      { label: "I. Dywidendy i udziały w zyskach", sub: true, value: z },
      { label: "II. Odsetki", sub: true, value: z },
      { label: "III. Zysk z tytułu rozchodu aktywów finansowych", sub: true, value: z },
      { label: "IV. Aktualizacja wartości aktywów finansowych", sub: true, value: z },
      { label: "V. Inne", sub: true, value: z },
      { label: "H. Koszty finansowe", major: true, value: function (r) { return r.interest; } },
      { label: "I. Odsetki", sub: true, value: function (r) { return r.interest; } },
      { label: "II. Strata z tytułu rozchodu aktywów finansowych", sub: true, value: z },
      { label: "III. Aktualizacja wartości aktywów finansowych", sub: true, value: z },
      { label: "IV. Inne", sub: true, value: z },
      { label: "I. Zysk (strata) brutto (F+G−H)", major: true, value: function (r) { return r.ebitda - r.depreciation - r.interest; } },
      { label: "J. Podatek dochodowy", major: true, value: function (r) { return r.tax; } },
      { label: "K. Pozostałe obowiązkowe zmniejszenia zysku (zwiększenia straty)", major: true, value: z },
      { label: "L. Zysk (strata) netto (I−J−K)", major: true, final: true, value: function (r) { return r.ebitda - r.depreciation - r.interest - r.tax; } }
    ];
  }

  /** Single project's RZiS in full statutory form (wariant porównawczy, per
   *  Załącznik nr 1 do ustawy o rachunkowości) — see singleProjectPnLRows
   *  for the line-by-line mapping. Reuses the shared renderStatutoryTable
   *  and statutoryBalanceRows defined below with the portfolio view (same
   *  field names, so no single-project-specific Bilans row defs are
   *  needed). */
  function renderPnLTable(m, granularity) {
    var rows = granularity === "monthly" ? m.monthRows.slice(0, 60) : m.yearRows;
    function periodLabel(r) { return granularity === "monthly" ? (r.year + " " + r.monthName) : ("Rok " + r.year + " (" + r.calendarYear + ")"); }
    var footnote = '<div class="assumption-note">Pełna forma rachunku zysków i strat (wariant porównawczy) zgodnie z Załącznikiem nr 1 do ustawy o rachunkowości — pozycje bez wartości dla tego projektu (np. zapasy, wynagrodzenia, przychody finansowe) wykazano jako 0, zgodnie z układem ustawowym.' +
      (granularity === "monthly" ? " Pokazano pierwsze 5 lat (60 miesięcy). Pełne dane dostępne są w eksporcie Excel." : "") + '</div>';
    renderStatutoryTable("pnl-table", singleProjectPnLRows(), rows, periodLabel, footnote);
  }

  /** Single project's Bilans in full statutory form, per Załącznik nr 1 do
   *  ustawy o rachunkowości — see statutoryBalanceRows/
   *  computeBalanceSheetSeries. Aktywa razem and Pasywa razem always tie out
   *  exactly (by construction), so this also doubles as a sanity check on
   *  the whole cash-flow engine. statutoryBalanceRows/renderStatutoryTable
   *  are defined further below (shared with the portfolio Bilans) — this
   *  function is still safe to call from renderResults because by the time
   *  it actually runs (on a later render pass) the whole script has already
   *  loaded, function declarations included. */
  function renderBalanceTable(bs, granularity) {
    var rows = granularity === "monthly" ? bs.monthRows.slice(0, 60) : bs.yearRows;
    function periodLabel(r) { return granularity === "monthly" ? (r.year + " " + r.monthName) : ("Rok " + r.year + " (" + r.calendarYear + ")"); }
    var footnote = '<div class="assumption-note">Pełna forma bilansu zgodnie z Załącznikiem nr 1 do ustawy o rachunkowości — pozycje bez wartości dla tego projektu (np. zapasy, należności, rezerwy) wykazano jako 0. „Zobowiązania długoterminowe”/„krótkoterminowe” dzielą saldo zadłużenia według tego, czy rata kapitałowa jest wymagalna w ciągu kolejnych 12 miesięcy od danego okresu. „AKTYWA RAZEM” i „PASYWA RAZEM” powinny się zgadzać w każdym okresie.' +
      (granularity === "monthly" ? " Pokazano pierwsze 5 lat (60 miesięcy). Pełne dane dostępne są w eksporcie Excel." : "") + '</div>';
    renderStatutoryTable("balance-table", statutoryBalanceRows(), rows, periodLabel, footnote);
  }

  /* ============================================================
     RENDER: RESULTS TAB

  function kpiTile(label, value, sub, cls) {
    return '<div class="kpi-tile"><div class="kpi-label">' + label + '</div>' +

      '<div class="chart-wrap"><canvas id="chart-cashflow"></canvas></div></div>' +

      '<div id="results-table"></div></div>' +
      '<div class="card"><div class="section-head"><h3>Rozbicie OPEX na pozycje' + (granularity === "monthly" ? " (pierwsze 5 lat)" : "") + '</h3><span class="hint">do weryfikacji zgodności z Twoimi założeniami</span></div>' +
      '<div id="opex-breakdown-table"></div></div>' +

    var btnExportXlsx = document.getElementById("btn-export-xlsx");
